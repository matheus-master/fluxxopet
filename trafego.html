<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Tráfego — Fluxxo Pet</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=swap" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --accent:#FF5A1F; --accent-soft:#FFE9E0;
      --surface:#FAFAFC; --canvas:#F5F6F8; --card:#FDFDFE;
      --ink:#0E0F11; --ink-2:#5F656D; --ink-3:#9AA0A8; --ink-off:#BCC0C7;
      --line:#E7E8EC; --bar:#DADCE1;
      --good:#22A75A; --bad:#E5484D;
    }
    html{background:var(--canvas)}
    body{background:var(--canvas);color:var(--ink);font-family:'Onest',system-ui,-apple-system,Segoe UI,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
    .ms{font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;font-size:20px;line-height:1;display:inline-block;font-variation-settings:'FILL' 1,'wght' 400}
    button,select,input{font:inherit;color:inherit}

    .frame{margin:24px;background:var(--canvas);border:1px solid var(--line);border-radius:20px;padding:24px 28px 32px;min-height:calc(100vh - 48px)}

    /* topo */
    .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
    .icons{display:flex;gap:10px}
    .ibtn{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;text-decoration:none;color:var(--ink);transition:background .15s}
    .ibtn:hover{background:#fff}
    .ibtn.on{background:var(--ink);border-color:var(--ink);color:#fff}
    .ibtn.spin .ms{animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .who{display:flex;align-items:center;gap:12px}
    .avatar{width:44px;height:44px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:600;font-size:1.05rem}
    .who b{display:block;font-weight:500;font-size:1.05rem}
    .who small{color:var(--ink-3);font-size:.78rem}

    .head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:30px 0 26px;flex-wrap:wrap}
    .title{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
    h1{font-weight:300;font-size:3rem;letter-spacing:-.02em;line-height:1}
    .views{display:flex;gap:6px}
    .view{height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:.9rem;display:flex;align-items:center;gap:7px}
    .view .ms{font-size:18px;font-variation-settings:'FILL' 0,'wght' 300}
    .view:hover{background:#fff}
    .view.on{background:var(--ink);color:#fff;border-color:var(--ink)}
    .filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
    /* seletor de período: uma caixa só, opção escolhida destacada dentro dela */
    .tabs{display:inline-flex;gap:2px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow-x:auto;max-width:100%;scrollbar-width:none}
    .tab{height:34px;padding:0 14px;border-radius:7px;border:none;background:transparent;color:var(--ink-2);cursor:pointer;white-space:nowrap;font-size:.88rem;transition:background .15s,color .15s}
    .tab:hover{color:var(--ink);background:var(--canvas)}
    .tab.on{background:var(--accent);color:#fff;box-shadow:0 1px 3px rgba(255,90,31,.35)}
    .box{height:44px;border-radius:8px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:8px;padding:0 14px;font-size:.88rem}
    .box input[type=date]{border:none;background:none;outline:none;font-size:.88rem;width:118px}
    .box input[type=date]::-webkit-calendar-picker-indicator{opacity:.55;cursor:pointer}
    .box .arrow{color:var(--ink-3);font-size:16px}
    /* escolher um mês fechado (janeiro, fevereiro…) */
    .mbox{position:relative;padding:0 10px 0 12px;cursor:pointer}
    .mbox .ms{font-size:18px;color:var(--ink-3)}
    .mbox select{flex:1;min-width:0;border:none;background:none;outline:none;font:inherit;font-size:.88rem;color:var(--ink-2);cursor:pointer;padding-right:4px}
    .mbox.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
    .mbox.on .ms,.mbox.on select{color:var(--accent);font-weight:500}

    .notice{border-radius:10px;padding:12px 16px;margin-bottom:12px;background:#FFF1EB;color:#9A3412;font-size:.84rem;display:flex;gap:8px;align-items:flex-start;line-height:1.5}
    .notice .ms{font-size:18px}
    .notice.info{background:var(--surface);color:var(--ink-2);border:1px solid var(--line)}

    /* KPIs */
    .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0 28px}
    .kpis-5{grid-template-columns:repeat(5,minmax(0,1fr))}
    .kpis-5 .big{font-size:1.95rem}
    .card{background:var(--card);border-radius:14px;padding:20px 22px;min-width:0}
    .kpi .row1{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:24px}
    .label{display:flex;align-items:center;gap:6px;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
    .label .ms{font-size:17px;font-variation-settings:'FILL' 0,'wght' 300;color:var(--accent)}
    .badge{font-size:.72rem;font-weight:500;color:#fff;border-radius:4px;padding:3px 7px;font-variant-numeric:tabular-nums;white-space:nowrap}
    .badge.good{background:var(--good)} .badge.bad{background:var(--bad)} .badge.flat{background:var(--ink-off)} .badge.neutral{background:var(--ink-2)}
    .kpi.hero .badge.neutral{background:#3A3D42}
    .kpi .row2{display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin-top:12px}
    .big{font-size:2.15rem;font-weight:400;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .unit{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
    .kpi.hero{background:var(--ink);color:#fff}
    .kpi.hero .label{color:#9AA0A8}
    .kpi.hero .big{color:var(--accent)}
    .kpi.hero .unit{color:#5F656D}

    /* gráficos */
    .chart-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
    .chart-head>*{min-width:0}
    .legend{display:flex;gap:16px;align-items:center;font-size:.76rem;color:var(--ink-2);flex-wrap:wrap}
    .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
    .legend .dot{background:var(--bar)} .legend .ring{border:2px solid var(--accent)} .legend .ring-g{border:2px solid var(--ink-2)}
    .legend .blk{background:var(--ink)} .legend .org{background:var(--accent)}
    .group{display:flex;gap:4px;overflow-x:auto;max-width:100%;scrollbar-width:none}
    .group button{border:none;background:none;padding:5px 10px;border-radius:6px;font-size:.78rem;color:var(--ink-3);cursor:pointer;white-space:nowrap}
    .group button.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
    .group button:not(.on):hover{color:var(--ink)}
    .plot{position:relative;height:340px}
    .plot.sm{height:240px}
    .main-chart{margin-bottom:10px;padding:22px 22px 16px}

    .duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
    .stats{display:flex;gap:48px;margin:6px 0 22px;flex-wrap:wrap}
    .stat .v{font-size:2rem;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
    .stat .v.org{color:var(--accent)}
    .stat .l{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-top:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .chg{font-size:.72rem;letter-spacing:0;font-variant-numeric:tabular-nums}
    .chg.good{color:var(--good)} .chg.bad{color:var(--bad)} .chg.flat{color:var(--ink-3)}

    /* rosca + lista (geral) */
    .split{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;align-items:center;margin-top:8px}
    .ring-box{position:relative;width:240px;height:240px}
    .ring-center{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
    .ring-center b{font-size:2.6rem;font-weight:400;letter-spacing:-.03em}
    .ring-center span{color:var(--ink-3);font-size:.82rem;margin-top:2px}
    .rows{display:flex;flex-direction:column;gap:14px}
    .rowi{display:grid;grid-template-columns:14px minmax(0,1fr) auto 48px;gap:10px;align-items:center;font-size:.9rem}
    .rowi i{width:10px;height:10px;border-radius:50%}
    .rowi .val{font-variant-numeric:tabular-nums}
    .rowi .pct{color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums}
    .camps{display:flex;flex-direction:column;gap:16px;margin-top:8px}
    .camp .nm{display:flex;justify-content:space-between;gap:12px;font-size:.84rem;margin-bottom:7px}
    .camp .nm span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
    .camp .nm b{font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
    .track{height:6px;border-radius:99px;background:#ECEDF0;overflow:hidden}
    .track i{display:block;height:100%;border-radius:99px}
    .camp small{color:var(--ink-3);font-size:.74rem;display:block;margin-top:5px}

    /* tooltip de vidro */
    .tip{position:absolute;pointer-events:none;opacity:0;transition:opacity .12s;z-index:5;
      background:rgba(250,250,252,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      border:1px solid rgba(231,232,236,.9);border-radius:14px;padding:14px 18px;box-shadow:0 10px 30px rgba(14,15,17,.08);min-width:170px}
    .tip .t{font-size:.8rem;color:var(--ink-2);margin-bottom:10px;white-space:nowrap}
    .tip .vals{display:flex;gap:22px}
    .tip .k{font-size:.72rem;color:var(--ink-2)}
    .tip .n{font-size:1.25rem;font-weight:500;letter-spacing:-.01em;white-space:nowrap;font-variant-numeric:tabular-nums}

    /* funil */
    .funnel{display:flex;flex-direction:column;align-items:center;gap:0;margin:10px 0 4px}
    .fstage{width:100%;display:flex;justify-content:center}
    .fbar{height:64px;border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 22px;min-width:220px;transition:width .4s}
    .fbar .fl{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;opacity:.75;white-space:nowrap}
    .fbar b{font-size:1.6rem;font-weight:400;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
    .frate{display:flex;align-items:center;gap:8px;padding:10px 0;font-size:.82rem;color:var(--ink-2)}
    .frate .ms{font-size:18px;color:var(--accent);font-variation-settings:'FILL' 0,'wght' 400}
    .frate b{color:var(--accent);font-weight:500;font-size:1rem;font-variant-numeric:tabular-nums}
    .trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
    .trio .stats{gap:28px}
    @media (max-width:1180px){ .trio{grid-template-columns:minmax(0,1fr)} }
    @media (max-width:640px){
      .fbar{min-width:0;padding:0 14px;height:56px} .fbar b{font-size:1.25rem} .fbar .fl{font-size:.64rem}
      /* no celular o funil afunila menos, para os rótulos caberem */
      .fs-1{width:92%!important} .fs-2{width:84%!important} .fs-3{width:76%!important}
      /* barra de ícones e abas cabendo em 390px */
      .icons{gap:6px} .who{gap:6px} .ibtn{width:40px;height:40px} .avatar{display:none}
      .views{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-right:-16px;padding-right:16px}
      .view{flex:none;padding:0 14px;font-size:.84rem} .view .ms{display:none}
    }

    /* ── experiência: foco, carregamento, vazio, ajuda ── */
    :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    button:focus:not(:focus-visible),a:focus:not(:focus-visible){outline:none}
    .progress{position:fixed;top:0;left:0;height:3px;width:0;background:var(--accent);z-index:100;opacity:0;transition:width .25s,opacity .3s}
    .loading .progress{opacity:1;width:70%;transition:width 6s cubic-bezier(.1,.7,.2,1),opacity .2s}
    .skel{background:linear-gradient(90deg,#ECEDF0 25%,#F6F7F9 50%,#ECEDF0 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:14px}
    @keyframes shimmer{to{background-position:-200% 0}}
    .empty-state{text-align:center;padding:64px 24px;color:var(--ink-2)}
    .empty-state .ms{font-size:40px;color:var(--ink-off);font-variation-settings:'FILL' 0,'wght' 300}
    .empty-state b{display:block;color:var(--ink);font-weight:500;font-size:1.05rem;margin:10px 0 6px}
    .notice button{margin-left:auto;border:1px solid currentColor;background:none;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:.8rem;color:inherit;white-space:nowrap}
    .hint{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:#ECEDF0;color:var(--ink-2);font-size:.6rem;font-weight:600;cursor:help;text-transform:none;letter-spacing:0}
    .kpi.hero .hint{background:#26282C;color:#9AA0A8}
    @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
    @media (max-width:640px){ .top{position:sticky;top:0;z-index:20;background:var(--canvas);margin:-16px -16px 0;padding:12px 16px} }

    .summary{background:var(--card);border-radius:14px;padding:18px 22px;margin-top:16px;display:flex;gap:14px;align-items:flex-start}
    .summary>.ms{color:var(--accent);font-size:22px;margin-top:1px;font-variation-settings:'FILL' 1,'wght' 400}
    .summary p{font-size:1rem;line-height:1.6;color:var(--ink)}
    .summary p b{font-weight:600}
    .summary small{display:block;color:var(--ink-3);font-size:.8rem;margin-top:6px;line-height:1.5}
    .summary + .kpis{margin-top:10px}
    .t-good{color:var(--good)} .t-bad{color:var(--bad)}
    .frate .plain{color:var(--ink-3);font-size:.78rem}
    .hint-pop{position:fixed;z-index:300;max-width:280px;background:var(--ink);color:#fff;border-radius:10px;padding:10px 12px;font-size:.82rem;line-height:1.45;box-shadow:0 10px 30px rgba(14,15,17,.2)}
    @media (max-width:640px){ .summary{padding:16px} .summary p{font-size:.94rem} .frate{flex-wrap:wrap;justify-content:center;text-align:center} }

    /* comercial */
    .fbar small{display:block;font-size:.72rem;opacity:.7;margin-top:2px;font-weight:400;letter-spacing:0;text-transform:none}
    .com-table{width:100%;border-collapse:collapse;font-size:.86rem;font-variant-numeric:tabular-nums}
    .com-table th{font-weight:400;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
    .com-table td{text-align:right;padding:12px;border-bottom:1px solid var(--line);white-space:nowrap}
    .com-table th:first-child,.com-table td:first-child{text-align:left}
    .com-table tr:last-child td{border-bottom:none}
    .com-table tfoot td{font-weight:600;border-top:1px solid var(--line)}
    .com-table .muted,.com-item .muted{color:var(--ink-3)}
    .table-scroll{overflow-x:auto}
    .com-form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-bottom:6px}
    .com-form .cli,.com-form button{grid-column:1/-1}
    .com-form input{height:44px;border-radius:8px;border:1px solid var(--line);background:#fff;padding:0 12px;font-size:.88rem;min-width:0;outline:none}
    .com-form input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
    .com-form button{height:44px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;padding:0 16px;font-weight:500;cursor:pointer;white-space:nowrap}
    .com-form button:disabled{opacity:.6;cursor:wait}
    .com-err{color:var(--bad);font-size:.8rem;min-height:18px;margin-bottom:6px}
    .com-list{display:flex;flex-direction:column}
    .com-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:.88rem}
    .com-item:last-child{border-bottom:none}
    .com-item .when{color:var(--ink-3);font-size:.78rem;width:64px;flex-shrink:0;font-variant-numeric:tabular-nums}
    .com-item .who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .com-item .val{font-variant-numeric:tabular-nums;white-space:nowrap}
    .com-item .won{font-size:.72rem;font-weight:500;color:#fff;background:var(--good);border-radius:4px;padding:2px 7px}
    .com-item button{border:1px solid var(--line);background:none;border-radius:6px;padding:4px 10px;font-size:.76rem;color:var(--ink-2);cursor:pointer;white-space:nowrap}
    .com-item button.sure{border-color:var(--bad);color:#fff;background:var(--bad)}
    .com-empty{color:var(--ink-3);font-size:.86rem;padding:18px 0}
    /* ActiveCampaign: status da reunião e etapas do funil */
    .com-item .won.st-ok{background:var(--good)} .com-item .won.st-ns{background:var(--bad)} .com-item .won.st-ag{background:var(--ink-3)}
    .ac-funil-t{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:14px 0 6px}
    .ac-funil-t:first-child{margin-top:4px}
    .ac-st{display:grid;grid-template-columns:minmax(150px,220px) minmax(0,1fr) 96px;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.86rem}
    .ac-st:last-child{border-bottom:none}
    .ac-st .nm{min-width:0}
    .ac-st .nm small{display:block;color:var(--ink-3);font-size:.74rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .com-list.scroll{max-height:560px;overflow-y:auto;padding-right:6px}
    .ac-st .tr{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
    .ac-st .tr i{display:block;height:100%;background:var(--ink);border-radius:5px}
    .ac-st.fech .tr i{background:var(--accent)}
    .ac-st .ct{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
    .ac-st .ct small{display:block;color:var(--ink-3);font-size:.74rem}
    @media (max-width:640px){ .com-list.scroll{max-height:420px} }
    .ac-check{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:6px 0 14px}
    .ac-check div{border:1px solid var(--line);border-radius:10px;padding:12px}
    .ac-check b{display:block;font-size:1.5rem;font-weight:400;font-variant-numeric:tabular-nums}
    .ac-check span{font-size:.76rem;color:var(--ink-2)}
    .ac-rules{list-style:none;display:flex;flex-direction:column;gap:6px;font-size:.84rem;color:var(--ink-2)}
    .ac-rules b{color:var(--ink);font-weight:500}
    /* comercial simplificado: o caminho em 4 números */
    .cflow-card{padding:22px 24px 24px;margin:10px 0}
    .cflow-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
    .cflow-inv{font-size:.86rem;color:var(--ink-2)} .cflow-inv b{color:var(--ink);font-weight:500;font-size:1.05rem;margin-left:4px}
    .cflow-inv .sep{margin:0 10px;color:var(--ink-3)} .cflow-inv b.ok{color:var(--good)}
    .cflow{display:grid;grid-template-columns:minmax(0,1fr) 112px minmax(0,1fr) 112px minmax(0,1fr) 112px minmax(0,1fr);align-items:stretch}
    .cf-step{border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:4px}
    .cf-step.end{background:var(--accent);border-color:var(--accent);color:#fff}
    .cf-l{font-size:.8rem;color:var(--ink-2)} .cf-step.end .cf-l,.cf-step.end .cf-s{color:rgba(255,255,255,.85)}
    .cf-v{font-size:2.6rem;font-weight:400;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
    .cf-s{font-size:.82rem;color:var(--ink-3)}
    .cf-arrow{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;position:relative}
    .cf-arrow::after{content:"→";color:var(--ink-3);font-size:1rem}
    .cf-arrow b{font-size:1.25rem;font-weight:500;color:var(--accent);font-variant-numeric:tabular-nums}
    .cf-arrow span{font-size:.74rem;color:var(--ink-2);line-height:1.25}
    .cflow-note{margin-top:12px;font-size:.8rem;color:var(--ink-3)}
    .com-more{margin-top:10px}
    .com-more>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 18px;border:1px solid var(--line);border-radius:12px;background:#fff;font-weight:500;font-size:.9rem}
    .com-more>summary::-webkit-details-marker{display:none}
    .com-more>summary::before{content:"+";width:20px;text-align:center;color:var(--accent);font-size:1.1rem}
    .com-more[open]>summary::before{content:"–"}
    .com-more>summary span{color:var(--ink-3);font-weight:400;font-size:.82rem}
    .com-more[open]>summary{margin-bottom:10px}
    @media (max-width:900px){
      .cflow{grid-template-columns:minmax(0,1fr)}
      .cf-step{flex-direction:row;align-items:baseline;flex-wrap:wrap;column-gap:12px}
      .cf-l{flex:1 1 100%} .cf-v{font-size:2rem}
      .cf-arrow{flex-direction:row;gap:8px;padding:8px 0}
      .cf-arrow::after{content:"↓";order:-1}
      .com-more>summary span{display:none}
    }
    @media (max-width:640px){ .ac-st{grid-template-columns:minmax(0,1fr) auto} .ac-st .tr{grid-column:1/-1;order:3} .ac-check{grid-template-columns:repeat(2,minmax(0,1fr))} .fs-4{width:68%!important} }

    .foot{color:var(--ink-3);font-size:.76rem;margin-top:18px;line-height:1.5}
    .loading #content{opacity:.45;transition:opacity .2s}

    @media (max-width:1280px){ .head{align-items:flex-start;flex-direction:column} .filters{justify-content:flex-start;width:100%} }
    @media (max-width:1180px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .kpis-5 .kpi.hero{grid-column:1/-1} .duo{grid-template-columns:minmax(0,1fr)} }
    @media (max-width:640px){
      .frame{margin:0;border:none;border-radius:0;padding:16px 16px 28px}
      h1{font-size:2.3rem}
      .title{gap:14px;width:100%}
      .views{width:100%} .view{flex:1;justify-content:center;padding:0 8px}
      .kpis{grid-template-columns:minmax(0,1fr)}
      .who div{display:none}
      .filters,.filters>*{width:100%}
      .box{justify-content:space-between}
      .box input[type=date]{width:auto;flex:1;min-width:0}
      .chart-head .legend{width:100%}
      .plot{height:260px} .plot.sm{height:220px}
      .stats{gap:28px}
      .split{grid-template-columns:minmax(0,1fr);justify-items:center}
      .split .rows{width:100%}
    }
  </style>
</head>
<body>

        <button class="view" data-v="seguidores"><span class="ms">favorite</span>Seguidores</button>

    <div class="skel" style="height:420px"></div>
  </div>

</div>

<script>
  /* ── estado ───────────────────────────────────────── */
  var VIEWS = ['geral', 'leads', 'seguidores', 'funil', 'comercial'];
  var state = { view: 'geral', period: 'mes', group: null, data: null, com: null };
  var charts = {};
  var C = { accent: '#FF5A1F', ink: '#0E0F11', ink2: '#5F656D', ink3: '#9AA0A8', bar: '#DADCE1', grid: '#ECEDF0' };
  var TYPES = [
    { k: 'leads', label: 'Leads', key: 'leadsSpend', color: C.accent },
    { k: 'seguidores', label: 'Seguidores', key: 'segSpend', color: C.ink },
    { k: 'outros', label: 'Outros', key: 'outrosSpend', color: C.bar },
  ];
  var GROUPS = [
    { k: 'dia', l: 'Dia', name: 'dia' }, { k: 'semana', l: 'Semana', name: 'semana' },
    { k: 'mes', l: 'Mês', name: 'mês' }, { k: 'trimestre', l: 'Trimestre', name: 'trimestre' },
    { k: 'semestre', l: 'Semestre', name: 'semestre' }, { k: 'ano', l: 'Ano', name: 'ano' },
  ];

  /* ── auth / api ───────────────────────────────────── */
  function getToken() { return sessionStorage.getItem('vt_token'); }
  async function api(path) {
    var t = getToken();
    if (!t) { location.href = '/login'; return null; }
    var r = await fetch(path, { headers: { Authorization: 'Bearer ' + t } });
    if (r.status === 401) { location.href = '/login'; return null; }
    return r.json();
  }

  /* ── datas (fuso de Brasília) ─────────────────────── */
  var DAY = 864e5;
  function today() { return new Date(Date.now() - 3 * 36e5).toISOString().slice(0, 10); }
  function addDays(d, n) { return new Date(Date.parse(d + 'T00:00:00Z') + n * DAY).toISOString().slice(0, 10); }
  function diffDays(a, b) { return Math.round((Date.parse(b) - Date.parse(a)) / DAY); }
  function dow(d) { return new Date(d + 'T00:00:00Z').getUTCDay(); }
  function monday(d) { return addDays(d, -((dow(d) + 6) % 7)); }

  // "Mês" = mês atual, do dia 1 até hoje, comparado com o mesmo trecho do mês anterior
  // (1–26/out × 1–26/set). As outras abas são janela móvel: N dias para trás a partir de
  // hoje (inclusive), comparados com a janela imediatamente anterior, do mesmo tamanho.
  var WINDOW = { dia: 1, semana: 7, mes: 30, trimestre: 90, semestre: 180, ano: 365 };
  function periodRange(p) {
    var t = today();
    // um mês escolhido na lista: o mês inteiro (até hoje, se for o atual) × o mês anterior inteiro
    if (p === "mesSel" && state.month) {
      var mi = state.month + "-01", ant = addDays(mi, -1);
      return { since: mi, until: [lastDay(state.month), t].sort()[0], prevSince: ant.slice(0, 8) + "01", prevUntil: ant };
    }
    if (p === "mes") {
      var ini = t.slice(0, 8) + "01", pIni = addDays(ini, -1).slice(0, 8) + "01";
      // dia 31 de hoje contra um mês de 30 dias: para no último dia do mês anterior
      return { since: ini, until: t, prevSince: pIni, prevUntil: [addDays(pIni, diffDays(ini, t)), addDays(ini, -1)].sort()[0] };
    }
    var n = WINDOW[p], s = addDays(t, -(n - 1));
    return { since: s, until: t, prevSince: addDays(s, -n), prevUntil: addDays(s, -1) };
  }
  function defaultGroup(since, until) {
    var n = diffDays(since, until) + 1;
    return n <= 31 ? 'dia' : n <= 120 ? 'semana' : n <= 800 ? 'mes' : 'trimestre';
  }

  /* ── agrupamento ──────────────────────────────────── */
  var MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  var MESES_L = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  var SUMS = ['spend', 'leadsSpend', 'leads', 'impr', 'clicks', 'lpv', 'segSpend', 'visits', 'outrosSpend'];
  function bucketKey(d, g) {
    var y = d.slice(0, 4), m = +d.slice(5, 7);
    if (g === 'dia') return d;
    if (g === 'semana') return monday(d);
    if (g === 'mes') return d.slice(0, 7);
    if (g === 'trimestre') return y + '-T' + Math.ceil(m / 3);
    if (g === 'semestre') return y + '-S' + (m <= 6 ? 1 : 2);
    return y;
  }
  function shortDate(d) { return +d.slice(8, 10) + ' ' + MESES[+d.slice(5, 7) - 1]; }
  function longDate(d) { return shortDate(d) + ' ' + d.slice(0, 4); }
  function bucketLabel(b, g) {
    var k = b.key;
    if (g === 'dia' || g === 'semana') return k.slice(8, 10) + '/' + k.slice(5, 7);
    if (g === 'mes') return MESES[+k.slice(5, 7) - 1] + '/' + k.slice(2, 4);
    if (g === 'trimestre' || g === 'semestre') return k.slice(5) + '/' + k.slice(2, 4);
    return k;
  }
  function bucketTitle(b, g) {
    if (g === 'dia') return longDate(b.first);
    if (g === 'mes') return MESES_L[+b.key.slice(5, 7) - 1] + ' ' + b.key.slice(0, 4);
    if (g === 'ano') return b.key;
    return shortDate(b.first) + ' – ' + longDate(b.last);
  }
  // soma os dias em baldes; seguidores = null quando o balde não tem nenhum dia com dado
  function aggregate(daily, g) {
    var out = [], idx = {};
    daily.forEach(function (d) {
      var k = bucketKey(d.date, g), b = idx[k];
      if (!b) { b = idx[k] = { key: k, first: d.date, last: d.date, followers: null, folSpend: 0 }; SUMS.forEach(function (s) { b[s] = 0; }); out.push(b); }
      b.last = d.date;
      SUMS.forEach(function (s) { b[s] += d[s]; });
      if (d.followers != null) { b.followers = (b.followers || 0) + d.followers; b.folSpend += d.segSpend; }
    });
    return out;
  }
  function cumulate(buckets, key, out) {
    var acc = 0;
    buckets.forEach(function (b) { acc += b[key] || 0; b[out] = acc; });
  }
  function sumDaily(daily) {
    var t = { followers: null, folSpend: 0, folDays: 0 };
    SUMS.forEach(function (s) { t[s] = 0; });
    daily.forEach(function (d) {
      SUMS.forEach(function (s) { t[s] += d[s]; });
      if (d.followers != null) { t.followers = (t.followers || 0) + d.followers; t.folSpend += d.segSpend; t.folDays++; }
    });
    return t;
  }

  /* ── formatação ───────────────────────────────────── */
  var brl  = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
  var int  = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 0 });
  var dec1 = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 1, minimumFractionDigits: 1 });
  function compact(v, money) {
    var p = money ? 'R$ ' : '';
    if (Math.abs(v) >= 1e6) return p + dec1.format(v / 1e6) + ' mi';
    if (Math.abs(v) >= 1e3) return p + dec1.format(v / 1e3) + ' mil';
    return p + int.format(v);
  }
  function ratio(a, b) { return b ? a / b : null; }
  var pct2 = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 2, minimumFractionDigits: 2 });
  function rate(a, b) { return b ? a / b * 100 : null; }
  function pctTxt(v) { return v == null ? '—' : pct2.format(v) + '%'; }
  // variação de taxa em pontos percentuais (p.p.), mais honesto que % de %
  function ppHtml(cur, prev, asBadge, title) {
    if (cur == null || prev == null) return '';
    var d = cur - prev, cls = Math.abs(d) < 0.005 ? 'flat' : d > 0 ? 'good' : 'bad';
    var txt = (d > 0 ? '+' : '') + pct2.format(d) + ' p.p.';
    return asBadge ? '<span class="badge ' + cls + '" title="' + esc(title || '') + '">' + txt + '</span>'
                   : '<span class="chg ' + cls + '">' + (d > 0 ? '↑ ' : '↓ ') + txt + '</span>';
  }
  function money(v) { return v == null ? '—' : brl.format(v); }
  function change(cur, prev) { return (cur == null || !prev) ? null : (cur - prev) / prev * 100; }
  // lowerIsBetter: true = custo (cair é bom), false = volume (subir é bom), null = neutro (ex.: investimento)
  function tone(d, lowerIsBetter) { return Math.abs(d) < 0.05 ? 'flat' : lowerIsBetter === null ? 'neutral' : ((d < 0) === !!lowerIsBetter ? 'good' : 'bad'); }
  function badgeHtml(cur, prev, lowerIsBetter, title) {
    var d = change(cur, prev);
    if (d == null) return '';
    return '<span class="badge ' + tone(d, lowerIsBetter) + '" title="' + esc(title || '') + '">' + (d > 0 ? '+' : '') + dec1.format(d) + '%</span>';
  }
  function chgHtml(cur, prev, lowerIsBetter) {
    var d = change(cur, prev);
    if (d == null) return '';
    return '<span class="chg ' + tone(d, lowerIsBetter) + '">' + (d > 0 ? '↑ +' : '↓ ') + dec1.format(d) + '%</span>';
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function $(id) { return document.getElementById(id); }

  /* ── componentes ──────────────────────────────────── */
  function kpi(o) {
    return '<div class="card kpi' + (o.hero ? ' hero' : '') + '">' +
      '<div class="row1"><span class="label"><span class="ms" aria-hidden="true">' + o.icon + '</span>' + o.label +
      (o.info ? ' <span class="hint" title="' + esc(o.info) + '" aria-label="' + esc(o.info) + '" tabindex="0">i</span>' : '') + '</span>' + (o.badge || '') + '</div>' +
      '<div class="row2"><span class="big">' + o.value + '</span><span class="unit">' + (o.unit || '') + '</span></div></div>';
  }
  function chartCard(o) {
    return '<div class="card">' +
      '<div class="chart-head"><span class="label"><span class="ms">' + o.icon + '</span>' + o.label + '</span>' +
      '<div class="legend">' + o.legend + '</div></div>' +
      (o.stats ? '<div class="stats">' + o.stats + '</div>' : '') +
      (o.body || '<div class="plot sm"><canvas id="' + o.id + '"></canvas><div class="tip" id="tip-' + o.id + '"></div></div>') + '</div>';
  }
  function stat(v, l, extra, cls) {
    return '<div class="stat"><div class="v ' + (cls || '') + '">' + v + '</div><div class="l">' + l + (extra || '') + '</div></div>';
  }
  function mainCard(title, legend) {
    var g = state.group;
    return '<section class="card main-chart"><div class="chart-head">' +
      '<span class="label"><span class="ms">payments</span>' + title + '</span>' +
      '<div class="legend">' + legend + '<div class="group">' +
      GROUPS.map(function (x) { return '<button class="' + (x.k === g ? 'on' : '') + '" data-g="' + x.k + '">' + x.l + '</button>'; }).join('') +
      '</div></div></div><div class="plot"><canvas id="c-main"></canvas><div class="tip" id="tip-c-main"></div></div></section>';
  }

  /* ── gráficos ─────────────────────────────────────── */
  // barras finas (uma ou empilhadas) + linha suave; a coluna sob o cursor
  // fica destacada e abre o tooltip de vidro
  function drawChart(id, buckets, opt) {
    var hover = -1;
    var series = opt.series || [{ data: opt.bars, color: opt.barColor }];
    var stacked = series.length > 1;
    function colorOf(s, i) {
      var base = typeof s.color === 'function' ? s.color(i) : s.color;
      if (hover < 0) return base;
      if (stacked) return i === hover ? base : base + '55';
      return i === hover ? (opt.hoverColor || C.accent) : base;
    }
    var datasets = series.map(function (s) {
      return { type: 'bar', data: s.data, yAxisID: 'y', order: 2, stack: 'a',
        backgroundColor: function (c) { return colorOf(s, c.dataIndex); },
        borderRadius: stacked ? 3 : 6, borderSkipped: false, maxBarThickness: opt.thick || 10, barPercentage: .5, categoryPercentage: .9 };
    });
    if (opt.line) datasets.push({ type: 'line', data: opt.line, yAxisID: 'y1', order: 1,
      // monotone: a curva passa pelos pontos sem "inventar" picos entre eles;
      // spanGaps falso: dia sem resultado (custo indefinido) interrompe a linha
      borderColor: opt.lineColor, borderWidth: 2.5, cubicInterpolationMode: 'monotone', fill: false, spanGaps: !!opt.spanGaps,
      pointRadius: function (c) { var v = opt.line, i = c.dataIndex; return v[i] != null && v[i - 1] == null && v[i + 1] == null ? 3 : 0; },
      pointBackgroundColor: opt.lineColor, pointBorderWidth: 0, pointHoverRadius: 0 });
    var tick = { color: C.ink3, font: { family: 'Onest', size: 11 } };
    var tip = $('tip-' + id);

    var chart = new Chart($(id), {
      data: { labels: buckets.map(function (b) { return bucketLabel(b, state.group); }), datasets: datasets },
      options: {
        maintainAspectRatio: false, animation: { duration: 350 },
        interaction: { mode: 'index', intersect: false },
        layout: { padding: { top: 8 } },
        scales: {
          x: { stacked: true, grid: { display: false }, border: { display: false }, ticks: Object.assign({ maxRotation: 0, autoSkipPadding: 14 }, tick) },
          y: { stacked: true, beginAtZero: true, grid: { color: C.grid }, border: { display: false },
               ticks: Object.assign({ maxTicksLimit: 6, callback: function (v) { return opt.tickFmt ? opt.tickFmt(v) : compact(v, opt.money); } }, tick) },
          y1: { display: !!opt.line, beginAtZero: true, position: 'right', grid: { display: false }, border: { display: false },
                ticks: Object.assign({ maxTicksLimit: 6, callback: function (v) { return compact(v, opt.lineMoney); } }, tick) },
        },
        plugins: {
          legend: { display: false },
          tooltip: { enabled: false, external: function (ctx) {
            var t = ctx.tooltip;
            if (!t.opacity || !t.dataPoints || !t.dataPoints.length) { tip.style.opacity = 0; return; }
            var b = buckets[t.dataPoints[0].dataIndex];
            tip.innerHTML = '<div class="t">' + bucketTitle(b, state.group) + '</div><div class="vals">' +
              opt.tip(b).map(function (p) { return '<div><div class="k">' + p[0] + '</div><div class="n">' + p[1] + '</div></div>'; }).join('') + '</div>';
            var w = tip.offsetWidth, box = ctx.chart.canvas.parentNode.clientWidth;
            var x = t.caretX + 16; if (x + w > box) x = t.caretX - w - 16;
            tip.style.left = Math.max(0, x) + 'px';
            tip.style.top = Math.max(0, ctx.chart.chartArea.top + 10) + 'px';
            tip.style.opacity = 1;
          } },
        },
        onHover: function (e, els, ch) {
          var pts = ch.getElementsAtEventForMode(e, 'index', { intersect: false }, false);
          var i = pts.length ? pts[0].index : -1;
          if (i !== hover) { hover = i; ch.update('none'); }
        },
      },
    });
    chart.canvas.addEventListener('mouseleave', function () { hover = -1; chart.update('none'); tip.style.opacity = 0; });
    charts[id] = chart;
  }

  function drawRing(id, values, colors) {
    charts[id] = new Chart($(id), {
      type: 'doughnut',
      data: { datasets: [{ data: values, backgroundColor: colors, borderWidth: 0, borderRadius: 6, spacing: 3 }] },
      options: { cutout: '84%', maintainAspectRatio: false, animation: { duration: 400 },
                 plugins: { legend: { display: false }, tooltip: { enabled: false } } },
    });
  }

  /* ── views ────────────────────────────────────────── */
  // contexto comum: período, comparação e "mês" (vira média diária se o período já é o mês)
  function ctx() {
    var d = state.data, g = state.group;
    return {
      d: d, g: g, gname: GROUPS.filter(function (x) { return x.k === g; })[0].name,
      buckets: aggregate(d.daily, g), tot: sumDaily(d.daily),
      prev: d.prev, m: d.month, pm: d.prevMonth,
      nd: diffDays(d.since, d.until) + 1,
      pnd: d.prev ? diffDays(d.prev.since, d.prev.until) + 1 : 0,
      mLabel: MESES[+d.until.slice(5, 7) - 1] + '/' + d.until.slice(2, 4),
      mUnit: MESES_L[+d.until.slice(5, 7) - 1].toLowerCase() + (d.until === today() ? ' até hoje' : ' até ' + shortDate(d.until)),
      cmp: d.prev ? 'vs ' + longDate(d.prev.since) + ' – ' + longDate(d.prev.until) : '',

        var nf = fm[ym];
        return '<tr><td>' + MESES_L[+ym.slice(5) - 1] + ' ' + ym.slice(0, 4) + (part ? ' <span class="muted">(parcial)</span>' : '') + '</td><td>' + money(m.leadsSpend) + '</td><td>' + int.format(m.leads) + '</td><td>' + nr +
          '</td><td>' + (nf != null ? nf + (part ? ' <span class="muted">(mês inteiro)</span>' : '') : '<span class="muted">não informado</span>') +
          '</td><td>' + pctTxt(rate(nr, m.leads)) + '</td><td>' + (nf != null ? pctTxt(rate(nf, nr)) : '<span class="muted">—</span>') + '</td><td>' + (nr ? money(m.leadsSpend / nr) : '<span class="muted">—</span>') + '</td></tr>';
      }).join('');
      var table = chartCard({ icon: 'calendar_month', label: 'Mês a mês', legend: '<span>fechamentos de um mês podem vir de reuniões de meses anteriores</span>',
        body: '<div class="table-scroll"><table class="com-table"><thead><tr><th>Mês</th><th>Investido</th><th>Leads</th><th>Reuniões</th><th>Fechamentos</th><th>Lead → reunião</th><th>Reunião → fech.</th><th>Custo por reunião</th></tr></thead><tbody>' + rowsM +
          '</tbody><tfoot><tr><td>Período</td><td>' + money(spend) + '</td><td>' + int.format(leads) + '</td><td>' + nR + '</td><td>' + (nF != null ? nF : '—') + '</td><td>' + pctTxt(rLR) + '</td><td>' + pctTxt(rRF) + '</td><td>' + money(cpr) + '</td></tr></tfoot></table></div>' });

      // fechamentos por mês (planilha) + reuniões do período
      var allYm = {}; com.fechMensal.forEach(function (m) { allYm[m.ym] = 1; });
      for (var ym = d.since.slice(0, 7); ym <= d.until.slice(0, 7); ym = nextYm(ym)) allYm[ym] = 1;
      var fechCard = chartCard({ icon: 'handshake', label: 'Fechamentos por mês', legend: '<span>da planilha</span>',
        body: '<div class="com-list">' + Object.keys(allYm).sort().reverse().map(function (ym) {
          var inP = ym >= d.since.slice(0, 7) && ym <= d.until.slice(0, 7);
          var nr = com.reunioes.filter(function (r) { return r.data.slice(0, 7) === ym; }).length;
          return '<div class="com-item"><span class="who">' + MESES_L[+ym.slice(5) - 1] + ' ' + ym.slice(0, 4) + (inP ? ' <span class="won" style="background:var(--accent)">no período</span>' : '') + '</span>' +
            '<span class="muted" style="font-size:.8rem">' + nr + (nr === 1 ? ' reunião' : ' reuniões') + '</span>' +
            '<span class="val"><b style="font-weight:600">' + (fm[ym] != null ? fm[ym] + (fm[ym] === 1 ? ' fechamento' : ' fechamentos') : '<span class="muted" style="font-weight:400">não informado</span>') + '</b></span></div>';
        }).join('') + '</div><p class="com-empty" style="padding-bottom:0">Para atualizar, preencha a coluna <b>Fechamentos</b> do resumo mensal na planilha e toque em ⟳.</p>' });
      var reunCard = chartCard({ icon: 'event_available', label: 'Reuniões do período', legend: '<span>da planilha</span>',
        body: '<div class="com-list">' + (reun.length ? reun.slice().sort(function (a, b) { return b.data.localeCompare(a.data); }).map(function (r) {
          return '<div class="com-item"><span class="when">' + fmtShort(r.data) + '</span><span class="who">' + esc(r.cliente) + '</span></div>';
        }).join('') : '<p class="com-empty">Nenhuma reunião concluída neste período.</p>') + '</div>' });

      return {
        html: summaryHtml(txt, x) + '<section class="kpis">' + cards + '</section>' + funnel + table + '<section class="duo" style="margin-top:10px">' + fechCard + reunCard + '</section>',
        draw: function () {},
      };
    },
  };

  /* ── comercial: dados da planilha ─────────────────────── */
  var comLoading = false;
  async function loadCom() {
    if (comLoading) return;
    comLoading = true;
    try {
      var r = await api('/api/comercial');
      if (r && r.ok) {
        state.com = r;
        if (r.erro) notice('Planilha comercial: ' + r.erro);
        if (state.view === 'comercial') render();
      } else if (r) notice('Não consegui carregar a planilha comercial: ' + (r.error || 'erro no servidor') + '.', true);
    } catch (e) { notice('Sem conexão para carregar a planilha comercial.', true); }
    finally { comLoading = false; }
  }
  /* ── comercial: ActiveCampaign (reuniões, no-show, fechamentos e etapas) ─── */
  var acLoading = false;
  async function loadAc(fresh) {
    if (acLoading) return;
    acLoading = true;
    try {
      var r = await api('/api/ac-funil' + (fresh ? '?fresh=1' : ''));
      state.ac = r && r.ok ? r : { ok: false, error: (r && r.error) || 'erro no servidor' };
    } catch (e) { state.ac = { ok: false, error: 'sem conexão' }; }
    finally { acLoading = false; }
    if (state.view === 'comercial') render();
  }
  function nextYm(ym) { var y = +ym.slice(0, 4), m = +ym.slice(5, 7) + 1; if (m > 12) { m = 1; y++; } return y + '-' + String(m).padStart(2, '0'); }
  function fmtShort(ymd) { return ymd.slice(8, 10) + '/' + ymd.slice(5, 7) + '/' + ymd.slice(2, 4); }
  function lastDay(ym) { var dt = new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5, 7), 0)); return dt.toISOString().slice(0, 10); }

  /* ── frases do resumo ──────────────────────────────── */
  function periodPhrase() {
    var d = state.data;
    if (state.period === 'dia') return 'Hoje';
    if (state.period === 'mesSel') return 'Em ' + MESES_L[+state.month.slice(5) - 1].toLowerCase() + ' de ' + state.month.slice(0, 4) + (d.until === today() ? ' (até hoje)' : '');
    if (state.period === 'mes') return 'Em ' + MESES_L[+d.until.slice(5, 7) - 1].toLowerCase() + (d.until.slice(8) === '01' ? ' (só hoje, dia 1)' : ' (de 1 a ' + +d.until.slice(8) + ')');
    if (state.period !== 'custom') return 'Nos últimos ' + WINDOW[state.period] + ' dias';
    return 'De ' + longDate(d.since) + ' a ' + longDate(d.until);
  }
  // "subiram 93%" / "caíram 12%" em verde ou vermelho; goodWhenUp null = neutro
  function moveTxt(cur, prev, up, down, goodWhenUp, stable) {
    var d = change(cur, prev);
    if (d == null) return null;
    if (Math.abs(d) < 1) return stable;
    var cls = goodWhenUp == null ? '' : ((d > 0) === goodWhenUp ? 't-good' : 't-bad');
    return '<b class="' + cls + '">' + (d > 0 ? up : down).replace('{n}', int.format(Math.abs(d))) + '</b>';
  }
  function joinParts(parts) {
    parts = parts.filter(Boolean);
    if (parts.length <= 1) return parts.join('');
    return parts.slice(0, -1).join(', ') + ' e ' + parts[parts.length - 1];
  }
  function summaryHtml(text, x) {
    return '<section class="summary"><span class="ms" aria-hidden="true">lightbulb</span><div><p>' + text + '</p>' +
      (x.d.prev ? '<small>As porcentagens comparam com ' + longDate(x.d.prev.since) + ' – ' + longDate(x.d.prev.until) + ', o período anterior de mesmo tamanho. Verde = melhorou, vermelho = piorou, cinza = só mudou (caso do investimento). Toque no <b>i</b> de cada card para ver o que ele mede.</small>' : '') +
      '</div></section>';
  }
  // "≈ 16 de cada 1.000": escolhe a base para o número ficar legível
  function peopleBase(pct) { return pct >= 5 ? 100 : pct >= 0.5 ? 1000 : 10000; }
  function perPeople(pct) {
    if (pct == null || pct === 0) return '';
    var base = peopleBase(pct);
    return '≈ ' + int.format(Math.round(pct / 100 * base)) + ' de cada ' + int.format(base);
  }

  function pctOf(a, b) { return b ? Math.round(a / b * 100) + '%' : '0%'; }

  /* ── render ───────────────────────────────────────── */
  function render() {
    var d = state.data; if (!d) return;
    Object.keys(charts).forEach(function (k) { charts[k].destroy(); delete charts[k]; });
    var x = ctx();

    // período sem veiculação: mensagem clara em vez de cards e gráficos zerados
    var spendKey = { geral: 'spend', leads: 'leadsSpend', seguidores: 'segSpend', funil: 'leadsSpend' }[state.view];
    if (spendKey && !x.tot[spendKey]) {
      var what = { geral: 'na conta', leads: 'em campanhas de leads', seguidores: 'em campanhas de seguidores', funil: 'em campanhas de leads' }[state.view];
      $('content').innerHTML = '<div class="card empty-state"><span class="ms" aria-hidden="true">event_busy</span>' +
        '<b>Nenhum investimento ' + what + ' neste período</b>' +
        '<span>' + longDate(d.since) + ' – ' + longDate(d.until) + '. Escolha um período maior ou outra aba.</span></div>';
      $('notice').innerHTML = '';
      $('foot').textContent = '';
      return;
    }

    var v = RENDER[state.view](x);
    $('content').innerHTML = v.html;
    v.draw();

    // avisos e rodapé por aba
    var notes = [];
    if (state.view === 'seguidores') {
      if (d.ig.error) notes.push(['error', 'Seguidores indisponíveis: ' + d.ig.error]);
      else if (x.tot.folDays < x.nd) {
        notes.push(['info', 'Seguidores com dado em ' + x.tot.folDays + ' de ' + x.nd + ' dias' +
          (d.ig.firstDay ? ' (histórico desde ' + longDate(d.ig.firstDay) + ')' : '') +
          '. O Instagram só guarda 30 dias e leva 1–2 dias para consolidar; o painel salva cada dia e o histórico vai crescendo.']);
      }
    }
    if (state.view === 'comercial' && state.ac) {
      if (!state.ac.ok) notes.push(['error', 'ActiveCampaign indisponível (' + state.ac.error + '). Mostrando reuniões e fechamentos da planilha.']);
      else (state.ac.avisos || []).forEach(function (a) { notes.push(['info', 'ActiveCampaign: ' + a]); });
    }
    $('notice').innerHTML = notes.map(function (n) {
      return '<div class="notice ' + (n[0] === 'info' ? 'info' : '') + '"><span class="ms">' + (n[0] === 'info' ? 'info' : 'error') + '</span><span>' + esc(n[1]) + '</span></div>';
    }).join('');

    var src = {
      geral: 'conta inteira; tipos pelo objetivo da campanha (Leads = cadastro, Seguidores = visita ao perfil)',
      leads: 'só campanhas com objetivo de cadastro · leads = evento Lead atribuído pelo Meta',
      seguidores: 'só campanhas otimizadas para visita ao perfil · seguidores = ganho diário do Instagram (orgânico + pago)',
      funil: 'só campanhas com objetivo de cadastro · CTR = cliques no link ÷ impressões · connect rate = visualizações da página ÷ cliques · conversão = leads ÷ visualizações',
      comercial: state.ac && state.ac.ok
        ? 'investimento e leads = Meta (campanhas de cadastro) · reuniões, no-show, fechamentos e etapas = ActiveCampaign (atualiza a cada 10 min; ⟳ força)'
        : 'investimento e leads = Meta (campanhas de cadastro) · reuniões e fechamentos = planilha comercial (fechamentos por mês)',
    }[state.view];
    $('foot').textContent = 'Fonte: Meta Ads · ' + src + ' · comparação ' + (x.cmp || '—') +
      ' · atualizado às ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }

  // aviso com botão opcional de "tentar de novo"
  function notice(msg, retry) {
    $('notice').innerHTML = msg ? '<div class="notice"><span class="ms" aria-hidden="true">error</span><span>' + esc(msg) + '</span>' +
      (retry ? '<button type="button" onclick="load(true)">Tentar de novo</button>' : '') + '</div>' : '';
  }

  /* ── preferências (lembra período e agrupamento) ─── */
  var PREFS_KEY = 'trafego_prefs';
  function savePrefs() {
    try { localStorage.setItem(PREFS_KEY, JSON.stringify({ period: state.period, month: state.month, group: state.group, since: $('since').value, until: $('until').value })); } catch (e) {}
  }
  function readPrefs() {
    try { return JSON.parse(localStorage.getItem(PREFS_KEY) || 'null'); } catch (e) { return null; }
  }

  /* ── carregamento ─────────────────────────────────── */
  // cache na memória da página: voltar a um período já visto é instantâneo
  var memo = {}, MEMO_TTL = 5 * 60e3;
  var seq = 0;
  async function load(force) {
    var since = $('since').value, until = $('until').value;
    if (!since || !until || since > until) { notice('Escolha um período válido: a data inicial precisa ser antes da final.'); return; }
    var q = 'since=' + since + '&until=' + until;
    if (state.period !== 'custom') { var r = periodRange(state.period); q += '&prevSince=' + r.prevSince + '&prevUntil=' + r.prevUntil; }
    savePrefs();

    var hit = memo[q];
    if (!force && hit && Date.now() - hit.t < MEMO_TTL) { seq++; apply(hit.data, since, until); return; }

    var my = ++seq, app = $('app'), rb = $('refresh');
    app.classList.add('loading'); rb.classList.add('spin'); app.setAttribute('aria-busy', 'true');
    try {
      var data = await api('/api/meta-trafego?' + q + (force ? '&fresh=1' : ''));
      if (my !== seq || !data) return;
      if (!data.ok) { notice('Não consegui carregar os dados do Meta: ' + (data.error || 'verifique o token') + '.', true); return; }
      memo[q] = { t: Date.now(), data: data };
      apply(data, since, until);
    } catch (e) {
      if (my === seq) notice('Sem conexão com o servidor. Confira a internet e tente de novo.', true);
    } finally {
      if (my === seq) { app.classList.remove('loading'); rb.classList.remove('spin'); app.removeAttribute('aria-busy'); }
    }
  }
  function apply(data, since, until) {
    notice('');
    state.data = data;
    if (data.account) $('acctName').textContent = 'Meta Ads · ' + data.account;
    if (!state.group) state.group = defaultGroup(since, until);
    render();
  }

  function markTabs() {
    document.querySelectorAll('.tab').forEach(function (t) { var on = t.dataset.p === state.period; t.classList.toggle('on', on); t.setAttribute('aria-pressed', on); });
    var sel = state.period === 'mesSel';
    $('mbox').classList.toggle('on', sel);
    $('monthSel').value = sel ? state.month : '';
  }
  // lista dos meses de 2026, de janeiro até o mês atual (meses futuros ficam de fora)
  var ANO_LISTA = 2026;
  function fillMonths() {
    var t = today(), ate = +t.slice(0, 4) > ANO_LISTA ? 12 : +t.slice(5, 7), html = '<option value="">Escolher mês</option>';
    for (var m = 1; m <= ate; m++) html += '<option value="' + ANO_LISTA + '-' + String(m).padStart(2, '0') + '">' + MESES_L[m - 1] + ' ' + ANO_LISTA + '</option>';
    $('monthSel').innerHTML = html;
  }
  function setPeriod(p, keepGroup) {
    state.period = p;
    markTabs();
    if (p === 'custom') { $('since').focus(); return; }
    var r = periodRange(p);
    $('since').value = r.since; $('until').value = r.until;
    if (!keepGroup) state.group = defaultGroup(r.since, r.until);
    load();
  }

  function setView(v) {
    state.view = VIEWS.indexOf(v) >= 0 ? v : 'geral';
    document.querySelectorAll('.view').forEach(function (b) { var on = b.dataset.v === state.view; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    if (location.hash.slice(1) !== state.view) history.replaceState(null, '', '#' + state.view);
    render();
  }

  /* ── eventos ──────────────────────────────────────── */
  $('tabs').addEventListener('click', function (e) { var b = e.target.closest('.tab'); if (b) setPeriod(b.dataset.p); });
  $('monthSel').addEventListener('change', function () {
    if (!this.value) { setPeriod('mes'); return; }
    state.month = this.value; setPeriod('mesSel');
  });
  $('views').addEventListener('click', function (e) { var b = e.target.closest('.view'); if (b) setView(b.dataset.v); });
  ['since', 'until'].forEach(function (id) {
    $(id).addEventListener('change', function () {
      state.period = 'custom';
      markTabs();
      var s = $('since').value, u = $('until').value;
      if (s && u) state.group = defaultGroup(s, u);
      load();
    });
  });
  $('content').addEventListener('click', function (e) {
    var b = e.target.closest('.group button'); if (!b) return;
    state.group = b.dataset.g; savePrefs(); render();
  });
  $('refresh').addEventListener('click', function () { load(true); state.com = null; state.ac = undefined; if (state.view === 'comercial') loadAc(true); });
  // toque/clique no "i" mostra a explicação (no celular não existe "passar o mouse")
  var hintPop = null;
  function closeHint() { if (hintPop) { hintPop.remove(); hintPop = null; } }
  document.addEventListener('click', function (e) {
    var hEl = e.target.closest('.hint');
    closeHint();
    if (!hEl) return;
    hintPop = document.createElement('div');
    hintPop.className = 'hint-pop'; hintPop.setAttribute('role', 'tooltip');
    hintPop.textContent = hEl.getAttribute('title');
    document.body.appendChild(hintPop);
    var rc = hEl.getBoundingClientRect(), w = hintPop.offsetWidth;
    hintPop.style.left = Math.max(12, Math.min(window.innerWidth - w - 12, rc.left - w / 2 + rc.width / 2)) + 'px';
    hintPop.style.top = (rc.bottom + 8) + 'px';
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeHint();
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('hint')) { e.preventDefault(); e.target.click(); }
  });
  window.addEventListener('scroll', closeHint, { passive: true });
  window.addEventListener('hashchange', function () { setView(location.hash.slice(1)); });

  if (!getToken()) location.href = '/login';
  else {
    $('until').max = today();
    fillMonths();
    setView(location.hash.slice(1));
    // volta para o período e o agrupamento da última visita
    var pf = readPrefs();
    if (pf && pf.period === 'custom' && pf.since && pf.until) {
      state.period = 'custom'; markTabs();
      $('since').value = pf.since; $('until').value = pf.until;
      state.group = pf.group || defaultGroup(pf.since, pf.until);
      load();
    } else if (pf && pf.period === 'mesSel' && /^\d{4}-\d{2}$/.test(pf.month || '')) {
      state.month = pf.month; state.group = pf.group || null;
      setPeriod('mesSel', !!pf.group);
    } else if (pf && WINDOW[pf.period]) {
      state.group = pf.group || null;
      setPeriod(pf.period, !!pf.group);
    } else setPeriod('mes');
  }
</script>
</body>
</html>
