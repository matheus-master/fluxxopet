<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Gestão — Fluxxo Pet</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=swap" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    /* ══ visual do /trafego (copiado: os dois painéis têm a mesma cara) ══ */
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --accent:#FF5A1F; --accent-soft:#FFE9E0;
      --surface:#FAFAFC; --canvas:#F5F6F8; --card:#FDFDFE;
      --ink:#0E0F11; --ink-2:#5F656D; --ink-3:#9AA0A8; --ink-off:#BCC0C7;
      --line:#E7E8EC; --bar:#DADCE1;
      --good:#22A75A; --bad:#E5484D;
    }
    html{background:var(--canvas)}
    body{background:var(--canvas);color:var(--ink);font-family:'Onest',system-ui,-apple-system,Segoe UI,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
    .ms{font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;font-size:20px;line-height:1;display:inline-block;font-variation-settings:'FILL' 1,'wght' 400}
    button,select,input{font:inherit;color:inherit}

    .frame{margin:24px;background:var(--canvas);border:1px solid var(--line);border-radius:20px;padding:24px 28px 112px;min-height:calc(100vh - 48px)}

    /* topo */
    .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
    .icons{display:flex;gap:10px}
    .ibtn{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;text-decoration:none;color:var(--ink);transition:background .15s}
    .ibtn:hover{background:#fff}
    .ibtn.on{background:var(--ink);border-color:var(--ink);color:#fff}
    .ibtn.spin .ms{animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .who{display:flex;align-items:center;gap:12px}
    .avatar{width:44px;height:44px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:600;font-size:1.05rem}
    .who b{display:block;font-weight:500;font-size:1.05rem}
    .who small{color:var(--ink-3);font-size:.78rem}

    .head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:30px 0 26px;flex-wrap:wrap}
    .title{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
    h1{font-weight:300;font-size:3rem;letter-spacing:-.02em;line-height:1}
    /* abas: menu flutuante fixo no rodapé da tela (o conteúdo ganha folga embaixo, no .frame) */
    .views{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;display:flex;gap:4px;padding:6px;max-width:calc(100vw - 24px);
      background:rgba(14,15,17,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:16px;box-shadow:0 12px 32px rgba(14,15,17,.24),0 2px 6px rgba(14,15,17,.14)}
    .view{height:44px;padding:0 16px;border-radius:11px;border:none;background:transparent;color:#C5C9CF;cursor:pointer;font-size:.88rem;display:flex;align-items:center;gap:7px;white-space:nowrap;transition:background .15s,color .15s}
    .view .ms{font-size:19px;font-variation-settings:'FILL' 0,'wght' 300}
    .view:hover{background:rgba(255,255,255,.09);color:#fff}
    .view.on{background:#fff;color:var(--ink)}
    .view.on .ms{font-variation-settings:'FILL' 1,'wght' 400}
    .filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
    /* seletor de período: uma caixa só, opção escolhida destacada dentro dela */
    .tabs{display:inline-flex;gap:2px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow-x:auto;max-width:100%;scrollbar-width:none}
    .tab{height:34px;padding:0 14px;border-radius:7px;border:none;background:transparent;color:var(--ink-2);cursor:pointer;white-space:nowrap;font-size:.88rem;transition:background .15s,color .15s}
    .tab:hover{color:var(--ink);background:var(--canvas)}
    .tab.on{background:var(--accent);color:#fff;box-shadow:0 1px 3px rgba(255,90,31,.35)}
    .box{height:44px;border-radius:8px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:8px;padding:0 14px;font-size:.88rem}
    .box input[type=date]{border:none;background:none;outline:none;font-size:.88rem;width:118px}
    .box input[type=date]::-webkit-calendar-picker-indicator{opacity:.55;cursor:pointer}
    .box .arrow{color:var(--ink-3);font-size:16px}
    /* escolher um mês fechado (janeiro, fevereiro…) */
    .mbox{position:relative;padding:0 10px 0 12px;cursor:pointer}
    .mbox .ms{font-size:18px;color:var(--ink-3)}
    .mbox select{flex:1;min-width:0;border:none;background:none;outline:none;font:inherit;font-size:.88rem;color:var(--ink-2);cursor:pointer;padding-right:4px}
    .mbox.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
    .mbox.on .ms,.mbox.on select{color:var(--accent);font-weight:500}

    .notice{border-radius:10px;padding:12px 16px;margin-bottom:12px;background:#FFF1EB;color:#9A3412;font-size:.84rem;display:flex;gap:8px;align-items:flex-start;line-height:1.5}
    .notice .ms{font-size:18px}
    .notice.info{background:var(--surface);color:var(--ink-2);border:1px solid var(--line)}

    /* KPIs */
    .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0 28px}
    .kpis-5{grid-template-columns:repeat(5,minmax(0,1fr))}
    .kpis-5 .big{font-size:1.95rem}
    .card{background:var(--card);border-radius:14px;padding:20px 22px;min-width:0}
    .kpi .row1{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:24px}
    .label{display:flex;align-items:center;gap:6px;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
    .label .ms{font-size:17px;font-variation-settings:'FILL' 0,'wght' 300;color:var(--accent)}
    .badge{font-size:.72rem;font-weight:500;color:#fff;border-radius:4px;padding:3px 7px;font-variant-numeric:tabular-nums;white-space:nowrap}
    .badge.good{background:var(--good)} .badge.bad{background:var(--bad)} .badge.flat{background:var(--ink-off)} .badge.neutral{background:var(--ink-2)}
    .kpi.hero .badge.neutral{background:#3A3D42}
    .kpi .row2{display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin-top:12px}
    .big{font-size:2.15rem;font-weight:400;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .unit{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
    .kpi.hero{background:var(--ink);color:#fff}
    .kpi.hero .label{color:#9AA0A8}
    .kpi.hero .big{color:var(--accent)}
    .kpi.hero .unit{color:#5F656D}

    /* gráficos */
    .chart-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
    .chart-head>*{min-width:0}
    .legend{display:flex;gap:16px;align-items:center;font-size:.76rem;color:var(--ink-2);flex-wrap:wrap}
    .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
    .legend .dot{background:var(--bar)} .legend .ring{border:2px solid var(--accent)} .legend .ring-g{border:2px solid var(--ink-2)}
    .legend .blk{background:var(--ink)} .legend .org{background:var(--accent)}
    .group{display:flex;gap:4px;overflow-x:auto;max-width:100%;scrollbar-width:none}
    .group button{border:none;background:none;padding:5px 10px;border-radius:6px;font-size:.78rem;color:var(--ink-3);cursor:pointer;white-space:nowrap}
    .group button.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
    .group button:not(.on):hover{color:var(--ink)}
    .plot{position:relative;height:340px}
    .plot.sm{height:240px}
    .main-chart{margin-bottom:10px;padding:22px 22px 16px}

    .duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
    .stats{display:flex;gap:48px;margin:6px 0 22px;flex-wrap:wrap}
    .stat .v{font-size:2rem;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
    .stat .v.org{color:var(--accent)}
    .stat .l{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-top:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .chg{font-size:.72rem;letter-spacing:0;font-variant-numeric:tabular-nums}
    .chg.good{color:var(--good)} .chg.bad{color:var(--bad)} .chg.flat{color:var(--ink-3)}

    /* rosca + lista (geral) */
    .split{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;align-items:center;margin-top:8px}
    .ring-box{position:relative;width:240px;height:240px}
    .ring-center{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
    .ring-center b{font-size:2.6rem;font-weight:400;letter-spacing:-.03em}
    .ring-center span{color:var(--ink-3);font-size:.82rem;margin-top:2px}
    .rows{display:flex;flex-direction:column;gap:14px}
    .rowi{display:grid;grid-template-columns:14px minmax(0,1fr) auto 48px;gap:10px;align-items:center;font-size:.9rem}
    .rowi i{width:10px;height:10px;border-radius:50%}
    .rowi .val{font-variant-numeric:tabular-nums}
    .rowi .pct{color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums}
    .camps{display:flex;flex-direction:column;gap:16px;margin-top:8px}
    .camp .nm{display:flex;justify-content:space-between;gap:12px;font-size:.84rem;margin-bottom:7px}
    .camp .nm span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
    .camp .nm b{font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
    .track{height:6px;border-radius:99px;background:#ECEDF0;overflow:hidden}
    .track i{display:block;height:100%;border-radius:99px}
    .camp small{color:var(--ink-3);font-size:.74rem;display:block;margin-top:5px}

    /* tooltip de vidro */
    .tip{position:absolute;pointer-events:none;opacity:0;transition:opacity .12s;z-index:5;
      background:rgba(250,250,252,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      border:1px solid rgba(231,232,236,.9);border-radius:14px;padding:14px 18px;box-shadow:0 10px 30px rgba(14,15,17,.08);min-width:170px}
    .tip .t{font-size:.8rem;color:var(--ink-2);margin-bottom:10px;white-space:nowrap}
    .tip .vals{display:flex;gap:22px}
    .tip .k{font-size:.72rem;color:var(--ink-2)}
    .tip .n{font-size:1.25rem;font-weight:500;letter-spacing:-.01em;white-space:nowrap;font-variant-numeric:tabular-nums}

    /* funil */
    .funnel{display:flex;flex-direction:column;align-items:center;gap:0;margin:10px 0 4px}
    .fstage{width:100%;display:flex;justify-content:center}
    .fbar{height:64px;border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 22px;min-width:220px;transition:width .4s}
    .fbar .fl{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;opacity:.75;white-space:nowrap}
    .fbar b{font-size:1.6rem;font-weight:400;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
    .frate{display:flex;align-items:center;gap:8px;padding:10px 0;font-size:.82rem;color:var(--ink-2)}
    .frate .ms{font-size:18px;color:var(--accent);font-variation-settings:'FILL' 0,'wght' 400}
    .frate b{color:var(--accent);font-weight:500;font-size:1rem;font-variant-numeric:tabular-nums}
    .trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
    .trio .stats{gap:28px}
    @media (max-width:1180px){ .trio{grid-template-columns:minmax(0,1fr)} }
    @media (max-width:640px){
      .fbar{min-width:0;padding:0 14px;height:56px} .fbar b{font-size:1.25rem} .fbar .fl{font-size:.64rem;white-space:normal;line-height:1.25;min-width:0}
      /* no celular o funil afunila menos, para os rótulos caberem */
      .fs-1{width:92%!important} .fs-2{width:84%!important} .fs-3{width:76%!important}
      /* barra de ícones cabendo em 390px; as abas viram a barra de baixo, ícone em cima do nome */
      .icons{gap:6px} .who{gap:6px} .ibtn{width:40px;height:40px} .avatar{display:none}
      .views{left:8px;right:8px;transform:none;max-width:none;bottom:calc(8px + env(safe-area-inset-bottom));gap:2px;padding:5px;border-radius:18px}
      .view{flex:1 1 0;min-width:0;height:54px;padding:0 1px;flex-direction:column;justify-content:center;gap:3px;font-size:.58rem;letter-spacing:-.01em;border-radius:13px}
      .view .ms{font-size:21px}
      .view .vt{max-width:100%;overflow:hidden;text-overflow:ellipsis}
    }

    /* ── experiência: foco, carregamento, vazio, ajuda ── */
    :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    button:focus:not(:focus-visible),a:focus:not(:focus-visible){outline:none}
    .progress{position:fixed;top:0;left:0;height:3px;width:0;background:var(--accent);z-index:100;opacity:0;transition:width .25s,opacity .3s}
    .loading .progress{opacity:1;width:70%;transition:width 6s cubic-bezier(.1,.7,.2,1),opacity .2s}
    .skel{background:linear-gradient(90deg,#ECEDF0 25%,#F6F7F9 50%,#ECEDF0 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:14px}
    @keyframes shimmer{to{background-position:-200% 0}}
    .empty-state{text-align:center;padding:64px 24px;color:var(--ink-2)}
    .empty-state .ms{font-size:40px;color:var(--ink-off);font-variation-settings:'FILL' 0,'wght' 300}
    .empty-state b{display:block;color:var(--ink);font-weight:500;font-size:1.05rem;margin:10px 0 6px}
    .notice button{margin-left:auto;border:1px solid currentColor;background:none;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:.8rem;color:inherit;white-space:nowrap}
    .hint{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:#ECEDF0;color:var(--ink-2);font-size:.6rem;font-weight:600;cursor:help;text-transform:none;letter-spacing:0}
    .kpi.hero .hint{background:#26282C;color:#9AA0A8}
    @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
    @media (max-width:640px){ .top{position:sticky;top:0;z-index:20;background:var(--canvas);margin:-16px -16px 0;padding:12px 16px} }

    .summary{background:var(--card);border-radius:14px;padding:18px 22px;margin-top:16px;display:flex;gap:14px;align-items:flex-start}
    .summary>.ms{color:var(--accent);font-size:22px;margin-top:1px;font-variation-settings:'FILL' 1,'wght' 400}
    .summary p{font-size:1rem;line-height:1.6;color:var(--ink)}
    .summary p b{font-weight:600}
    .summary small{display:block;color:var(--ink-3);font-size:.8rem;margin-top:6px;line-height:1.5}
    .summary + .kpis{margin-top:10px}
    .t-good{color:var(--good)} .t-bad{color:var(--bad)}
    .frate .plain{color:var(--ink-3);font-size:.78rem}
    .hint-pop{position:fixed;z-index:300;max-width:280px;background:var(--ink);color:#fff;border-radius:10px;padding:10px 12px;font-size:.82rem;line-height:1.45;box-shadow:0 10px 30px rgba(14,15,17,.2)}
    @media (max-width:640px){ .summary{padding:16px} .summary p{font-size:.94rem} .frate{flex-wrap:wrap;justify-content:center;text-align:center} }

    /* comercial */
    .fbar small{display:block;font-size:.72rem;opacity:.7;margin-top:2px;font-weight:400;letter-spacing:0;text-transform:none}
    .com-table{width:100%;border-collapse:collapse;font-size:.86rem;font-variant-numeric:tabular-nums}
    .com-table th{font-weight:400;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
    .com-table td{text-align:right;padding:12px;border-bottom:1px solid var(--line);white-space:nowrap}
    .com-table th:first-child,.com-table td:first-child{text-align:left}
    .com-table tr:last-child td{border-bottom:none}
    .com-table tfoot td{font-weight:600;border-top:1px solid var(--line)}
    .com-table .muted,.com-item .muted{color:var(--ink-3)}
    .fp-table td:first-child{white-space:normal;min-width:130px}
    @media (max-width:640px){ .fp-table th,.fp-table td{padding:10px 6px;white-space:normal} .fp-table td:first-child{min-width:0} .fp-table th{white-space:normal;font-size:.62rem} .fp-table .fp-pv{display:none} .fp-table .pg-hide{display:none} }
    .table-scroll{overflow-x:auto}
    .com-form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-bottom:6px}
    .com-form .cli,.com-form button{grid-column:1/-1}
    .com-form input{height:44px;border-radius:8px;border:1px solid var(--line);background:#fff;padding:0 12px;font-size:.88rem;min-width:0;outline:none}
    .com-form input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
    .com-form button{height:44px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;padding:0 16px;font-weight:500;cursor:pointer;white-space:nowrap}
    .com-form button:disabled{opacity:.6;cursor:wait}
    .com-err{color:var(--bad);font-size:.8rem;min-height:18px;margin-bottom:6px}
    .com-list{display:flex;flex-direction:column}
    .com-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:.88rem}
    .com-item:last-child{border-bottom:none}
    .com-item .when{color:var(--ink-3);font-size:.78rem;width:64px;flex-shrink:0;font-variant-numeric:tabular-nums}
    .com-item .who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .com-item .val{font-variant-numeric:tabular-nums;white-space:nowrap}
    .com-item .won{font-size:.72rem;font-weight:500;color:#fff;background:var(--good);border-radius:4px;padding:2px 7px}
    .com-item button{border:1px solid var(--line);background:none;border-radius:6px;padding:4px 10px;font-size:.76rem;color:var(--ink-2);cursor:pointer;white-space:nowrap}
    .com-item button.sure{border-color:var(--bad);color:#fff;background:var(--bad)}
    .com-empty{color:var(--ink-3);font-size:.86rem;padding:18px 0}
    /* ActiveCampaign: status da reunião e etapas do funil */
    .com-item .won.st-ok{background:var(--good)} .com-item .won.st-ns{background:var(--bad)} .com-item .won.st-ag{background:var(--ink-3)}
    .ac-funil-t{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:14px 0 6px}
    .ac-funil-t:first-child{margin-top:4px}
    .ac-st{display:grid;grid-template-columns:minmax(150px,220px) minmax(0,1fr) 96px;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.86rem}
    .ac-st:last-child{border-bottom:none}
    .ac-st .nm{min-width:0}
    .ac-st .nm small{display:block;color:var(--ink-3);font-size:.74rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .com-list.scroll{max-height:560px;overflow-y:auto;padding-right:6px}
    .ac-st .tr{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
    .ac-st .tr i{display:block;height:100%;background:var(--ink);border-radius:5px}
    .ac-st.fech .tr i{background:var(--accent)}
    .ac-st .ct{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
    .ac-st .ct small{display:block;color:var(--ink-3);font-size:.74rem}
    @media (max-width:640px){ .com-list.scroll{max-height:420px} }
    .ac-check{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:6px 0 14px}
    .ac-check div{border:1px solid var(--line);border-radius:10px;padding:12px}
    .ac-check b{display:block;font-size:1.5rem;font-weight:400;font-variant-numeric:tabular-nums}
    .ac-check span{font-size:.76rem;color:var(--ink-2)}
    .ac-rules{list-style:none;display:flex;flex-direction:column;gap:6px;font-size:.84rem;color:var(--ink-2)}
    .ac-rules b{color:var(--ink);font-weight:500}
    /* comercial simplificado: o caminho em 4 números */
    .cflow-card{padding:22px 24px 24px;margin:10px 0}
    .cflow-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
    .cflow-inv{font-size:.86rem;color:var(--ink-2)} .cflow-inv b{color:var(--ink);font-weight:500;font-size:1.05rem;margin-left:4px}
    .cflow-inv b{white-space:nowrap} .cflow-inv .sep{margin:0 10px;color:var(--ink-3)} .cflow-inv b.ok{color:var(--good)} .cflow-inv b.neg{color:var(--bad)}
    .cflow{display:grid;grid-template-columns:minmax(0,1fr) 112px minmax(0,1fr) 112px minmax(0,1fr) 112px minmax(0,1fr);align-items:stretch}
    .cf-step{border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:4px}
    .cf-step.end{background:var(--accent);border-color:var(--accent);color:#fff}
    .cf-l{font-size:.8rem;color:var(--ink-2)} .cf-step.end .cf-l,.cf-step.end .cf-s{color:rgba(255,255,255,.85)}
    .cf-v{font-size:2.6rem;font-weight:400;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
    .cf-s{font-size:.82rem;color:var(--ink-3)}
    .cf-arrow{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;position:relative}
    .cf-arrow::after{content:"→";color:var(--ink-3);font-size:1rem}
    .cf-arrow b{font-size:1.25rem;font-weight:500;color:var(--accent);font-variant-numeric:tabular-nums}
    .cf-arrow span{font-size:.74rem;color:var(--ink-2);line-height:1.25}
    .cflow-note{margin-top:12px;font-size:.8rem;color:var(--ink-3)}
    .cflow.n5{grid-template-columns:minmax(0,1fr) 92px minmax(0,1fr) 92px minmax(0,1fr) 92px minmax(0,1fr) 92px minmax(0,1fr)}
    .cflow.n5 .cf-step{padding:16px 14px 14px} .cflow.n5 .cf-v{font-size:2.2rem}
    .com-more{margin-top:10px}
    .com-more>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 18px;border:1px solid var(--line);border-radius:12px;background:#fff;font-weight:500;font-size:.9rem}
    .com-more>summary::-webkit-details-marker{display:none}
    .com-more>summary::before{content:"+";width:20px;text-align:center;color:var(--accent);font-size:1.1rem}
    .com-more[open]>summary::before{content:"–"}
    .com-more>summary span{color:var(--ink-3);font-weight:400;font-size:.82rem}
    .com-more[open]>summary{margin-bottom:10px}
    @media (max-width:900px){
      .cflow,.cflow.n5{grid-template-columns:minmax(0,1fr)}
      .cflow-top{flex-direction:column;align-items:flex-start;gap:6px} .cflow-inv b{margin-left:2px} .cflow-inv .sep{margin:0 6px}
      .cf-step{flex-direction:row;align-items:baseline;flex-wrap:wrap;column-gap:12px}
      .cf-l{flex:1 1 100%} .cf-v{font-size:2rem}
      .cf-arrow{flex-direction:row;gap:8px;padding:8px 0}
      .cf-arrow::after{content:"↓";order:-1}
      .com-more>summary span{display:none}
    }
    @media (max-width:640px){ .ac-st{grid-template-columns:minmax(0,1fr) auto} .ac-st .tr{grid-column:1/-1;order:3} .ac-check{grid-template-columns:repeat(2,minmax(0,1fr))} .fs-4{width:68%!important} }

    /* aba Saúde: leitura de relance (quem decide bate o olho e entende) */
    .v-saude .filters{display:none}
    .sz-nav{display:flex;align-items:center;gap:8px;margin-top:18px;flex-wrap:wrap}
    .sz-nav h2{font-size:1.6rem;font-weight:500;letter-spacing:-.02em}
    .sz-nav h2 span{color:var(--ink-3);font-weight:400}
    .sz-nav small{color:var(--ink-2);font-size:.85rem;margin-left:6px}
    .sz-mes{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
    .sz-mes:hover:not(:disabled){background:#fff;border-color:var(--ink-off)}
    .sz-mes:disabled{opacity:.35;cursor:default}
    .sz-mes.sz-hoje{width:auto;border-radius:999px;padding:0 14px;margin-left:auto;font-size:.85rem}
    .sz-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:10px;margin:14px 0 10px}
    .sz-hero,.sz-ano{padding:24px 26px}
    .sz-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
    .sz-k{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
    .sz-pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px 0 10px;border-radius:999px;font-weight:600;font-size:.9rem;white-space:nowrap}
    .sz-pill .ms{font-size:20px}
    .sz-pill.good{background:#E3F5EA;color:#137A3D} .sz-pill.bad{background:#FDE8E8;color:#C4262C} .sz-pill.flat{background:#EEF0F2;color:var(--ink-2)}
    .sz-fig{display:flex;align-items:baseline;gap:6px 12px;flex-wrap:wrap;margin-top:16px}
    .sz-fig b{font-size:3.5rem;font-weight:500;letter-spacing:-.03em;line-height:1}
    .sz-fig span{font-size:1.05rem;color:var(--ink-2)}
    .sz-fig.sm b{font-size:2.4rem}
    .sz-meter{position:relative;height:14px;border-radius:7px;margin-top:20px;background:#ECEDF0}
    .sz-meter i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--ink-3)}
    .sz-meter.good{background:#D9F1E2} .sz-meter.good i{background:var(--good)}
    .sz-meter.bad{background:#FBDFE0} .sz-meter.bad i{background:var(--bad)}
    .sz-meter u{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--ink)}
    .sz-mark{position:relative;height:18px;margin-top:8px;font-size:.78rem;color:var(--ink-2)}
    .sz-mark span{position:absolute;top:0;white-space:nowrap}
    .sz-facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
    .sz-facts.col{grid-template-columns:repeat(2,minmax(0,1fr))}
    .sz-facts dt{font-size:.78rem;color:var(--ink-2)}
    .sz-facts dd{font-size:1.3rem;font-weight:500;letter-spacing:-.01em;margin-top:4px}
    .sz-facts small{display:block;font-size:.75rem;color:var(--ink-3);margin-top:2px;line-height:1.35}
    .sz-vazio p{margin-top:14px;color:var(--ink-2);line-height:1.5}
    .sz-cta{margin-top:18px;height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-weight:500;cursor:pointer}
    .sz-diag{margin-bottom:10px}
    .sz-dt{font-size:1.1rem;line-height:1.4}
    .sz-dt.bad b{color:#C4262C;font-weight:600}
    .sz-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
    .sz-tile{border:1px solid var(--line);border-radius:12px;padding:14px 16px 16px;background:#fff;min-width:0}
    .sz-tile.bad{background:#FFF5F5;border-color:#F5CBCD}
    .sz-th{display:flex;justify-content:space-between;align-items:center;gap:6px}
    .sz-tk{font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
    .sz-ts{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:600;white-space:nowrap}
    .sz-ts .ms{font-size:18px}
    .sz-tile.good .sz-ts{color:#137A3D} .sz-tile.bad .sz-ts{color:#C4262C} .sz-tile.flat .sz-ts{color:var(--ink-2)}
    .sz-tn{font-weight:500;margin-top:10px}
    .sz-tv{font-size:1.8rem;font-weight:500;letter-spacing:-.02em;line-height:1.15;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sz-tv small{font-size:.8rem;color:var(--ink-3);font-weight:400;letter-spacing:0}
    .sz-td{font-size:.8rem;color:var(--ink-2);line-height:1.4;margin-top:4px}
    .sz-stack{display:grid;gap:10px}
    .hz-ic{font-size:18px;vertical-align:-4px} .hz-ic.good{color:var(--good)} .hz-ic.bad{color:var(--bad)}
    .hz-in{display:flex;flex-direction:column;gap:6px;font-size:.78rem;color:var(--ink-2)}
    @media (max-width:640px){ .hz-t td:not(:first-child){white-space:nowrap} }
    @media (max-width:1100px){ .sz-tiles{grid-template-columns:repeat(2,minmax(0,1fr))} }
    @media (max-width:900px){ .sz-grid{grid-template-columns:minmax(0,1fr)} }
    @media (max-width:640px){
      .sz-hero,.sz-ano{padding:20px 18px}
      .sz-fig b{font-size:2.6rem} .sz-fig.sm b{font-size:2rem}
      .sz-facts{grid-template-columns:minmax(0,1fr);gap:12px}
      .sz-tile{padding:12px}
      .sz-th{flex-wrap:wrap;gap:4px 6px}
      .sz-tv{font-size:1.4rem}
      .sz-nav h2{font-size:1.35rem}
    }
    /* meta anual: progresso + mês a mês; editor do período */
    .hz-yt td,.hz-yt th{padding-top:8px;padding-bottom:8px}
    .hz-yt tr.hz-cur td{background:var(--accent-soft)}
    .com-form.hz-pf{grid-template-columns:minmax(0,5fr) minmax(0,6fr);grid-template-rows:auto 1fr;grid-template-areas:'c t' 'a t';gap:16px 40px;align-items:start;margin-bottom:0}
    .hz-pfg{grid-area:c;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:end}
    .com-form select{height:44px;border-radius:8px;border:1px solid var(--line);background:#fff;padding:0 10px;font:inherit;font-size:.88rem;color:var(--ink);min-width:0;outline:none;cursor:pointer}
    .com-form select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
    .hz-pt{grid-area:t}
    .hz-pt td{padding:4px 6px}
    .hz-pt td:first-child{padding-left:0}
    .hz-pt input{height:36px;width:100%;min-width:96px;text-align:right}
    .hz-pa{grid-area:a}
    .hz-pa .cflow-note{margin:0 0 12px}
    .hz-pa button{width:100%}
    .hz-pa .com-err{margin:8px 0 0}
    @media (max-width:900px){
      .com-form.hz-pf{grid-template-columns:minmax(0,1fr);grid-template-rows:auto;grid-template-areas:'c' 't' 'a'}
    }

    .foot{color:var(--ink-3);font-size:.76rem;margin-top:18px;line-height:1.5}
    .loading #content{opacity:.45;transition:opacity .2s}
    .loading.v-saude #content{opacity:1}

    @media (max-width:1280px){ .head{align-items:flex-start;flex-direction:column} .filters{justify-content:flex-start;width:100%} }

    @media (max-width:640px){

    /* ══ /gestao: o que é só deste painel (o resto é o visual do /trafego, copiado acima) ══ */
    /* cada tela: título + pergunta, um card-resposta (selo, número grande, barra) e o detalhe embaixo */
    .gx-tt{margin:2px 0 14px}
    .gx-tt h2{font-size:1.55rem;font-weight:500;letter-spacing:-.02em}
    .gx-tt p{color:var(--ink-2);margin-top:4px;font-size:.95rem;line-height:1.45}
    .gx-h{font-size:.98rem;font-weight:600;margin:22px 0 10px;letter-spacing:-.005em}
    .gx-grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:10px}
    .gx-grid2>.card{min-width:0}
    .sz-grid{margin-top:0}
    .gx-side{display:flex;flex-direction:column;padding:22px 24px}
    .gx-side .sz-row{margin-bottom:6px}
    .gx-big{font-size:2.2rem;font-weight:500;letter-spacing:-.03em;line-height:1;margin-top:14px}
    .gx-big small{font-size:.95rem;color:var(--ink-2);font-weight:400;letter-spacing:0;margin-left:6px}
    .gx-txt{font-size:.88rem;color:var(--ink-2);line-height:1.55;margin-top:12px}
    .gx-txt b{color:var(--ink);font-weight:600}
    .gx-abrir{border:none;background:none;color:var(--accent);font:inherit;font-size:.85rem;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:2px;padding:4px 0;margin-top:auto;align-self:flex-start}
    .gx-abrir .ms{font-size:18px}
    .gx-tx{list-style:none;margin:14px 0 12px;padding-top:10px;border-top:1px solid var(--line);display:grid;gap:7px;font-size:.84rem;color:var(--ink-2)}
    .gx-tx li{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
    .gx-tx li b{color:var(--ink);font-weight:600}
    .gx-tx li.pior,.gx-tx li.pior b{color:#C4262C}
    .gx-nota{font-size:.78rem;color:var(--ink-3);margin-top:10px;line-height:1.5}
    .gx-vazio{color:var(--ink-2);font-size:.88rem;line-height:1.55;padding:4px 0}
    .chg.neutral{color:var(--ink-2)}
    .sz-facts .chg{margin-left:2px}
    /* funil em barras: a frase da taxa fica entre as etapas; a que mais caiu, em vermelho */
    .gx-fn{display:flex;flex-direction:column;margin-top:6px}
    .gx-fr{display:grid;grid-template-columns:minmax(96px,30%) minmax(0,1fr) minmax(48px,auto);gap:12px;align-items:center;padding:4px 0}
    .gx-fr .n{font-size:.86rem;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .gx-fr .b{height:24px;border-radius:6px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
    .gx-fr .b i{display:block;height:100%;min-width:3px;border-radius:6px;background:var(--accent)}
    .gx-fr .v{font-weight:600;font-size:1.05rem;text-align:right;white-space:nowrap}
    .gx-fx{display:grid;grid-template-columns:minmax(96px,30%) minmax(0,1fr) minmax(48px,auto);gap:12px;padding:1px 0}
    .gx-fx .t{grid-column:2;justify-self:start;display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--ink-2);padding:3px 10px;border-radius:999px;background:var(--canvas)}
    .gx-fx .t .ms{font-size:16px;color:var(--ink-3)}
    .gx-fx .t b{color:var(--ink);font-weight:600}
    .gx-fx.pior .t{background:#FDE8E8;color:#C4262C}
    .gx-fx.pior .t b,.gx-fx.pior .t .ms{color:#C4262C}
    .gx-fpe{display:flex;justify-content:space-between;gap:12px;font-size:.8rem;color:var(--ink-2);padding:10px 0 4px;border-top:1px solid var(--line);margin-top:10px;flex-wrap:wrap}
    .gx-fpe b{color:var(--ink);font-weight:600}
    /* barras horizontais (uma cor; destaque em laranja) */
    .gx-hb{display:flex;flex-direction:column;gap:2px;margin-top:2px}
    .gx-hr{display:grid;grid-template-columns:minmax(96px,38%) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.84rem;padding:6px 0}
    .gx-hn{color:var(--ink-2);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .gx-ht{height:12px}
    .gx-ht i{display:block;height:100%;min-width:2px;border-radius:4px;background:var(--bar)}
    .gx-ht i.dest{background:var(--accent)}
    .gx-hv{min-width:30px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
    .gx-hv small{color:var(--ink-3);margin-left:4px}
    /* lista ranqueada (campanhas, anúncios): miniatura, nome, barra e o número que importa */
    .gx-li{display:flex;flex-direction:column}
    .gx-lr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
    .gx-lr:first-child{border-top:none;padding-top:4px}
    .gx-lr .im{width:44px;height:44px;border-radius:9px;object-fit:cover;background:var(--line);display:block}
    .gx-lr .k{width:26px;height:26px;border-radius:50%;background:var(--canvas);color:var(--ink-2);display:grid;place-items:center;font-size:.78rem;font-weight:600}
    .gx-lr .t{min-width:0}
    .gx-lr .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .gx-lr .t small{display:block;color:var(--ink-3);font-size:.74rem;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .gx-lr .t .bar{height:6px;border-radius:3px;background:var(--canvas);margin-top:7px;overflow:hidden}
    .gx-lr .t .bar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
    .gx-lr .m{text-align:right;font-size:.78rem;color:var(--ink-2);white-space:nowrap}
    .gx-lr .m b{display:block;font-size:1.02rem;color:var(--ink);font-weight:600}
    .gx-lr.ruim .t .bar i{background:var(--ink-off)}
    /* destaques do conteúdo: repetir × cortar */

    .gx-dest h4 small{display:block;color:var(--ink-3);font-size:.76rem;font-weight:400;margin-top:2px}
    .gx-dest dl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
    .gx-dest dt{font-size:.72rem;color:var(--ink-2)}
    .gx-dest dd{font-size:1.05rem;font-weight:600;margin-top:2px;white-space:nowrap}
    /* posts do Instagram em grade */
    .gx-posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
    .gx-post{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;display:flex;flex-direction:column;text-decoration:none;color:inherit;position:relative}
    .gx-post .img{aspect-ratio:4/5;background:var(--line) center/cover no-repeat}
    .gx-post .c{padding:10px 12px 12px}
    .gx-post .c b{font-size:1.15rem;font-weight:600}
    .gx-post .c b small{font-size:.72rem;color:var(--ink-3);font-weight:400;margin-left:4px}
    .gx-post .c p{font-size:.78rem;color:var(--ink-2);margin-top:4px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .gx-post .c small.d{display:block;font-size:.72rem;color:var(--ink-3);margin-top:6px}
    .gx-post .tag{position:absolute;top:8px;left:8px;background:rgba(14,15,17,.75);color:#fff;font-size:.68rem;padding:3px 8px;border-radius:999px}
    .gx-post.dest{box-shadow:0 0 0 2px var(--accent)}
    .gx-post.dest .tag{background:var(--accent)}
    @media (max-width:1100px){ .sz-tiles{grid-template-columns:repeat(2,minmax(0,1fr))} }
    @media (max-width:900px){ .gx-grid2{grid-template-columns:minmax(0,1fr)} }
    @media (max-width:640px){
      /* o visual copiado esconde a marca no celular (lá ela divide espaço com os ícones); aqui ela fica */
      .gx-marca .avatar{display:grid;width:40px;height:40px} .gx-marca div{display:block}
      .gx-tt h2{font-size:1.35rem}
      .gx-side{padding:20px 18px}
      .gx-fr,.gx-fx{grid-template-columns:minmax(80px,34%) minmax(0,1fr) minmax(40px,auto);gap:8px}
      .gx-dest{grid-template-columns:72px minmax(0,1fr)}
      .gx-dest .im{width:72px;height:90px}
      .gx-dest dl{grid-template-columns:repeat(2,minmax(0,1fr))}
      .gx-posts{grid-template-columns:repeat(2,minmax(0,1fr))}
      .gx-hr{grid-template-columns:minmax(80px,40%) minmax(0,1fr) auto}
    }
  </style>

<body>
<div class="frame" id="app">
  <div class="progress" aria-hidden="true"></div>
  <!-- painel à parte: sem a barra de ícones do admin/tráfego e sem link para eles -->
  <div class="top">

<script>
(function () {
  'use strict';
  /* ── base ─────────────────────────────────────────── */
  var $ = function (id) { return document.getElementById(id); };
  var DAY = 864e5;
  var C = { accent: '#FF5A1F', ink: '#0E0F11', ink2: '#5F656D', ink3: '#9AA0A8', bar: '#DADCE1', grid: '#ECEDF0' };
  var brl = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
  var int = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 0 });
  var dec1 = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 1, minimumFractionDigits: 1 });
  var dec2 = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 2, minimumFractionDigits: 2 });
  var MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  function today() { return new Date(Date.now() - 3 * 36e5).toISOString().slice(0, 10); }
  function addDays(d, n) { return new Date(Date.parse(d + 'T00:00:00Z') + n * DAY).toISOString().slice(0, 10); }
  function diffDays(a, b) { return Math.round((Date.parse(b) - Date.parse(a)) / DAY); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function ok(v) { return v != null && isFinite(v); }
  function money(v) { return ok(v) ? brl.format(v) : '—'; }
  function m0(v) { return ok(v) ? 'R$ ' + int.format(Math.round(v)) : '—'; }
  function n0(v) { return ok(v) ? int.format(v) : '—'; }
  function pct(v) { return ok(v) ? dec1.format(v * 100) + '%' : '—'; }
  function pct2(v) { return ok(v) ? dec2.format(v * 100) + '%' : '—'; }
  function div(a, b) { return a == null || b == null || !b ? null : a / b; }
  function ddmm(d) { return d.slice(8, 10) + '/' + d.slice(5, 7); }
  function curto(ym) { return MESES[+ym.slice(5, 7) - 1] + '/' + ym.slice(2, 4); }
  function ymAdd(ym, n) { var t = +ym.slice(0, 4) * 12 + +ym.slice(5, 7) - 1 + n; return Math.floor(t / 12) + '-' + String(t % 12 + 1).padStart(2, '0'); }
  function lastDay(ym) { return new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5, 7), 0)).toISOString().slice(0, 10); }
  function mediana(a) { if (!a.length) return null; var s = a.slice().sort(function (x, y) { return x - y; }), k = s.length >> 1; return s.length % 2 ? s[k] : (s[k - 1] + s[k]) / 2; }
  function joinParts(p) { p = p.filter(Boolean); return p.length <= 1 ? p.join('') : p.slice(0, -1).join(', ') + ' e ' + p[p.length - 1]; }
  // variação em % e o tom: menorMelhor = true (custo), false (volume), null (só mudou)
  function variacao(a, b) { return ok(a) && ok(b) && b ? (a - b) / b * 100 : null; }
  function tom(d, menorMelhor) { return Math.abs(d) < 0.05 ? 'flat' : menorMelhor === null ? 'neutral' : ((d < 0) === !!menorMelhor ? 'good' : 'bad'); }
  function badge(a, b, menorMelhor) { var d = variacao(a, b); return d == null ? '' : '<span class="badge ' + tom(d, menorMelhor) + '">' + (d > 0 ? '+' : '') + dec1.format(d) + '%</span>'; }
  function chg(a, b, menorMelhor) { var d = variacao(a, b); return d == null ? '' : '<span class="chg ' + tom(d, menorMelhor) + '">' + (d > 0 ? '+' : '') + dec1.format(d) + '%</span>'; }
  function hint(t) { return t ? ' <span class="hint" title="' + esc(t) + '" aria-label="' + esc(t) + '" tabindex="0">i</span>' : ''; }

  function getToken() { return sessionStorage.getItem('vt_token'); }
  async function api(path) {
    var t = getToken();
    if (!t) { location.href = '/login'; return null; }
    var r = await fetch(path, { headers: { Authorization: 'Bearer ' + t } });
    if (r.status === 401) { location.href = '/login'; return null; }
    return r.json();
  }

  /* ── dados ────────────────────────────────────────── */
  // regra do Comercial (ac-funil): MQL = lead do site com faturamento ACIMA de R$ 50 mil
  function ehMql(f) { var s = String(f || '').toLowerCase(); if (/mais de/.test(s)) return true; var m = s.match(/(\d+)\s*mil/); return !!m && +m[1] > 50; }
  var ORIGEM = { anuncio_ig: 'Instagram (anúncio)', anuncio_fb: 'Facebook (anúncio)', meta: 'Meta sem UTM', google: 'Google', organico: 'Instagram orgânico', outros: 'Direto ou sem origem' };
  var FAIXAS = ['Até R$30 mil', 'Até R$50 mil', 'R$50 mil', 'R$100 mil', 'R$200 mil', 'Mais de R$200 mil'];
  // começo de cada fonte: antes disso não há comparação justa
  var INICIO = { meta: '2026-06-01', leads: '2026-06-17' };
  var HOJE = today(), HIST = [addDays(HOJE, -24 * 7 + 1), ymAdd(HOJE.slice(0, 7), -6) + '-01'].sort()[0];   // 12 + 12 semanas, ou 6 meses
  var PRIMEIRO_MES = '2026-06';   // o Meta começa em junho/2026
  var MESES_L = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  function nomeMes(ym) { return MESES_L[+ym.slice(5, 7) - 1]; }

  // período: S.mes ('AAAA-MM') ou, sem ele, as últimas S.sem semanas
  var S = { tela: 'resumo', sem: 4, mes: null, meta: null, leads: null, ac: null, metas: null, camp: {}, ads: {} };
  try {
    var p0 = JSON.parse(localStorage.getItem('gestao_prefs') || 'null');
    if (p0 && [4, 8, 12].indexOf(p0.sem) >= 0) S.sem = p0.sem;
    if (p0 && /^\d{4}-\d{2}$/.test(p0.mes || '') && p0.mes >= PRIMEIRO_MES && p0.mes <= HOJE.slice(0, 7)) S.mes = p0.mes;
  } catch (e) {}

  // c0..c1 = o período; p0..p1 = a comparação. Mês fechado × mês anterior inteiro; mês atual × o mesmo trecho do anterior
  function janelas() {
    if (S.mes) {
      var c0 = S.mes + '-01', c1 = [lastDay(S.mes), HOJE].sort()[0], pm = ymAdd(S.mes, -1), q0 = pm + '-01';
      return { c0: c0, c1: c1, p0: q0, p1: [addDays(q0, diffDays(c0, c1)), lastDay(pm)].sort()[0] };
    }
    var n = S.sem * 7, i0 = addDays(HOJE, -(n - 1));
    return { c0: i0, c1: HOJE, p0: addDays(i0, -n), p1: addDays(i0, -1) };
  }
  // como o período e a comparação aparecem nos textos
  function P() {
    if (!S.mes) return { per: 'últimas ' + S.sem + ' semanas', nas: 'nas últimas ' + S.sem + ' semanas', ant: 'as ' + S.sem + ' semanas anteriores', antCurto: S.sem + ' semanas anteriores', serie: 'semana' };
    var atual = S.mes === HOJE.slice(0, 7), pm = ymAdd(S.mes, -1), J = janelas();
    return { per: nomeMes(S.mes) + (atual ? ' até hoje' : ''), nas: 'em ' + nomeMes(S.mes) + (atual ? ' até hoje' : ''),
      ant: atual ? 'o mesmo trecho de ' + nomeMes(pm) : nomeMes(pm), antCurto: atual ? nomeMes(pm) + ' até o dia ' + +J.p1.slice(8) : nomeMes(pm), serie: 'mês' };
  }

  function agrega(ini, fim) {
    var o = { ini: ini, fim: fim, invest: 0, investLeads: 0, impr: 0, cliques: 0, lpv: 0, leadsAds: 0, leads: 0, leadsMeta: 0, mql: 0,
      faixa: {}, orig: {}, origMql: {}, utm: {}, reun: 0, realiz: 0, noshow: 0, vendas: 0, receita: 0, ciclos: [], vendasSite: 0, vendasFaixa: {} };
    var temMeta = !!(S.meta && S.meta.ok) && ini >= INICIO.meta, temLeads = !!(S.leads && S.leads.ok) && ini >= INICIO.leads,
      temAc = !!(S.ac && S.ac.ok) && ini >= S.ac.desde;
    if (temMeta) S.meta.daily.forEach(function (d) {
      if (d.date < ini || d.date > fim) return;
      o.invest += d.spend; o.investLeads += d.leadsSpend; o.impr += d.impr; o.cliques += d.clicks; o.lpv += d.lpv; o.leadsAds += d.leads;
    });
    if (temLeads) S.leads.linhas.forEach(function (l) {
      if (l.d < ini || l.d > fim) return;
      var mq = ehMql(l.faixa), fx = l.faixa || 'Não informou';
      o.leads += l.n; if (mq) o.mql += l.n;
      o.faixa[fx] = (o.faixa[fx] || 0) + l.n;
      o.orig[l.o] = (o.orig[l.o] || 0) + l.n; if (mq) o.origMql[l.o] = (o.origMql[l.o] || 0) + l.n;
      if (/^anuncio|^meta$/.test(l.o)) o.leadsMeta += l.n;
      [l.c, l.t].forEach(function (id) { if (!id) return; var u = o.utm[id] || (o.utm[id] = { leads: 0, mql: 0 }); u.leads += l.n; if (mq) u.mql += l.n; });
    });
    if (temAc) {
      S.ac.reunioes.forEach(function (r) {
        if (r.data < ini || r.data > fim || r.data > HOJE) return;
        o.reun++; if (r.st === 'realizada') o.realiz++; else if (r.st === 'noshow') o.noshow++;
      });
      S.ac.fechamentos.forEach(function (f) {
        if (f.data < ini || f.data > fim) return;
        o.vendas++; o.receita += f.valor || 0;
        if (f.criado && f.criado <= f.data) o.ciclos.push(diffDays(f.criado, f.data));
        if (f.site) o.vendasSite++;
        var fx = f.site ? (f.fat || 'Não informou') : 'Fora do site (bot, indicação…)';
        o.vendasFaixa[fx] = (o.vendasFaixa[fx] || 0) + 1;
      });
    }
    if (!temMeta) ['invest', 'investLeads', 'impr', 'cliques', 'lpv', 'leadsAds'].forEach(function (k) { o[k] = null; });
    if (!temLeads) ['leads', 'leadsMeta', 'mql'].forEach(function (k) { o[k] = null; });
    if (!temAc) ['reun', 'realiz', 'noshow', 'vendas', 'receita', 'vendasSite'].forEach(function (k) { o[k] = null; });
    o.cpl = div(o.invest, o.leads); o.qual = div(o.mql, o.leads); o.cmql = div(o.invest, o.mql);
    o.pass = div(o.reun, o.mql); o.comp = div(o.realiz, o.reun); o.conv = div(o.vendas, o.realiz);
    o.ticket = div(o.receita, o.vendas); o.cac = div(o.invest, o.vendas);
    o.ctr = div(o.cliques, o.impr); o.cpm = o.impr ? o.investLeads / o.impr * 1000 : null; o.cpc = div(o.investLeads, o.cliques);
    o.abertura = div(o.lpv, o.cliques); o.convPag = div(o.leadsMeta, o.lpv); o.ciclo = mediana(o.ciclos);
    o.temMeta = temMeta; o.temLeads = temLeads; o.temAc = temAc;
    return o;
  }
  // gráficos: semanas de 7 dias terminando hoje (período + comparação) ou, com um mês escolhido, os 6 meses até ele
  function semanas() {
    var J = janelas(), out = [];
    if (S.mes) {
      var ini = ymAdd(S.mes, -5); if (ini < PRIMEIRO_MES) ini = PRIMEIRO_MES;
      for (var m = ini; m <= S.mes; m = ymAdd(m, 1)) { var wm = agrega(m + '-01', [lastDay(m), HOJE].sort()[0]); wm.atual = m === S.mes; wm.rot = curto(m); out.push(wm); }
      return out;
    }
    for (var k = 0; k < S.sem * 2; k++) {
      var a = addDays(J.p0, k * 7), b = addDays(a, 6), w = agrega(a, b);
      w.atual = a >= J.c0; w.rot = ddmm(a);
      out.push(w);
    }
    return out;
  }

  /* ── carregamento: cada fonte entra quando chega ───── */
  var pend = 0;
  function progresso(d) { pend += d; $('app').classList.toggle('loading', pend > 0); $('refresh').classList.toggle('spin', pend > 0); }
  // o servidor entrega a última leitura e atualiza em segundo plano; vendo "geradoEm" vencido, busca de novo
  function fonte(url, velhoMin, get, set, n) {
    progresso(1);
    api(url).then(function (r) { return r && r.ok ? r : { ok: false, error: (r && r.error) || 'erro no servidor' }; },
      function () { return { ok: false, error: 'sem conexão' }; }).then(function (r) {
      progresso(-1);
      var antes = get();
      if (!r.ok && n && antes && antes.ok) return;
      var mudou = !antes || antes.ok !== r.ok || antes.geradoEm !== r.geradoEm;
      set(r);
      if (velhoMin && r.ok && r.geradoEm && Date.now() - Date.parse(r.geradoEm) > velhoMin * 60e3 && (n || 0) < 3)
        setTimeout(function () { fonte(url.replace(/[?&]fresh=1/, ''), velhoMin, get, set, (n || 0) + 1); }, 5000 * ((n || 0) + 1));
      if (mudou) render();
    });
  }
  function carregarCamp(fresh) {
    var J = janelas(), k = J.c0;
    if (S.camp[k] && !fresh) return;
    S.camp[k] = S.camp[k] || null;
    fonte('/api/meta-trafego?since=' + J.c0 + '&until=' + J.c1 + '&swr=1' + (fresh ? '&fresh=1' : ''), 5, function () { return S.camp[k]; }, function (r) { S.camp[k] = r; });
  }
  function carregarAds(fresh) {
    var J = janelas(), k = J.c0;
    if (S.ads[k] !== undefined && !fresh) return;
    S.ads[k] = S.ads[k] || null;
    fonte('/api/meta-anuncios?since=' + J.c0 + '&until=' + J.c1 + (fresh ? '&fresh=1' : ''), 10, function () { return S.ads[k]; }, function (r) { S.ads[k] = r; });
  }
  function carregar(fresh) {
    fonte('/api/meta-trafego?since=' + HIST + '&until=' + HOJE + '&swr=1' + (fresh ? '&fresh=1' : ''), 5, function () { return S.meta; }, function (r) { S.meta = r; });
    fonte('/api/gestao-leads?desde=' + HIST, 0, function () { return S.leads; }, function (r) { S.leads = r; });
    fonte('/api/ac-funil', 10, function () { return S.ac; }, function (r) { S.ac = r; });
    fonte('/api/metas', 0, function () { return S.metas; }, function (r) { S.metas = r; });
    carregarCamp(fresh);
    if (S.tela === 'conteudo') carregarAds(fresh);
  }

  /* ── peças da tela ────────────────────────────────── */
  var charts = [];
  var ICS = { good: 'check_circle', bad: 'cancel', flat: 'remove_circle' };
  function pill(s, t) { return '<span class="sz-pill ' + s + '"><span class="ms" aria-hidden="true">' + ICS[s] + '</span>' + t + '</span>'; }
  function titulo(nome, q) { return '<header class="gx-tt"><h2>' + nome + '</h2><p>' + q + '</p></header>'; }
  // porcentagem para ler: sem casa decimal a partir de 10%
  function pctL(v) { return !ok(v) ? '—' : Math.abs(v) >= 0.1 ? int.format(Math.round(v * 100)) + '%' : dec1.format(v * 100) + '%'; }
  // comparação para ler: contagem pequena em número ("+1"), o resto em % arredondado; abaixo de 5% = estável
  function cmp(a, b, menor, contagem) {
    if (!ok(a) || !ok(b)) return '';
    if (contagem && b < 20) {
      var dd = Math.round(a - b);
      return dd ? '<span class="chg ' + (menor === null ? 'neutral' : (dd < 0) === !!menor ? 'good' : 'bad') + '">' + (dd > 0 ? '+' : '') + int.format(dd) + '</span>' : '<span class="chg flat">igual</span>';
    }
    var d = variacao(a, b);
    if (d == null) return '';
    if (Math.abs(d) < 5) return '<span class="chg flat">estável</span>';
    return '<span class="chg ' + (menor === null ? 'neutral' : (d < 0) === !!menor ? 'good' : 'bad') + '">' + (d > 0 ? '↑ ' : '↓ ') + int.format(Math.abs(Math.round(d))) + '%</span>';
  }
  // situação contra o período anterior: good / bad / flat (abaixo de 5%) / null (sem comparação)
  function situacao(a, b, menor) { var d = variacao(a, b); return d == null ? null : Math.abs(d) < 5 ? 'flat' : (d < 0) === !!menor ? 'good' : 'bad'; }
  function meter(s, real, alvo, esp, rotulo) {
    var pr = alvo ? Math.min(100, real / alvo * 100) : 0, pe = alvo && esp != null ? Math.min(100, esp / alvo * 100) : null;
    return '<div class="sz-meter ' + s + '" role="img" aria-label="' + int.format(Math.round(alvo ? real / alvo * 100 : 0)) + '% da meta"><i style="width:' + pr + '%"></i>' + (pe != null ? '<u style="left:' + pe + '%"></u>' : '') + '</div>' +
      (pe != null ? '<div class="sz-mark"><span style="' + (pe < 50 ? 'left:' + pe : 'right:' + (100 - pe)) + '%">' + rotulo + '</span></div>' : '');
  }
  function fato(f) { return '<div><dt>' + f[0] + '</dt><dd>' + f[1] + '</dd>' + (f[2] ? '<small>' + f[2] + '</small>' : '') + '</div>'; }
  // card-resposta: selo, número grande, barra (opcional) e até 3 fatos
  function hero(o) {
    return '<section class="card sz-hero"><div class="sz-row"><span class="sz-k">' + o.k + hint(o.info) + '</span>' + (o.pill ? pill(o.pill[0], o.pill[1]) : '') + '</div>' +
      '<div class="sz-fig"><b>' + o.valor + '</b>' + (o.de ? '<span>' + o.de + '</span>' : '') + '</div>' +
      (o.meter ? meter.apply(null, o.meter) : '') + (o.fatos && o.fatos.length ? '<dl class="sz-facts">' + o.fatos.map(fato).join('') + '</dl>' : '') + '</section>';
  }
  function cartao(icon, titulo, legenda, corpo, extra) {
    return '<div class="card' + (extra ? ' ' + extra : '') + '"><div class="chart-head"><span class="label"><span class="ms" aria-hidden="true">' + icon + '</span>' + titulo + '</span>' +
      (legenda ? '<div class="legend">' + legenda + '</div>' : '') + '</div>' + corpo + '</div>';
  }
  function plot(id) { return '<div class="plot sm"><canvas id="' + id + '" role="img"></canvas></div>'; }
  // destaque(item, posição): as barras em laranja (padrão: só a maior); it.txt troca o número da direita
  function barrasH(itens, fmt, destaque) {
    if (!itens.length) return '<p class="gx-vazio">Sem dados no período.</p>';
    var max = Math.max.apply(null, itens.map(function (i) { return i.v || 0; }));
    destaque = destaque || function (it, k) { return k === 0; };
    return '<div class="gx-hb">' + itens.map(function (it, k) {
      return '<div class="gx-hr"><span class="gx-hn" title="' + esc(it.nome) + '">' + esc(it.nome) + '</span><span class="gx-ht"><i class="' + (it.v && destaque(it, k) ? 'dest' : '') + '" style="width:' + (max ? (it.v || 0) / max * 100 : 0) + '%"></i></span><span class="gx-hv">' + (it.txt || fmt(it.v)) + '</span></div>';
    }).join('') + '</div>';
  }
  function ordena(obj, nomes) { return Object.keys(obj).map(function (k) { return { k: k, nome: nomes ? nomes[k] || k : k, v: obj[k] }; }).sort(function (a, b) { return b.v - a.v; }); }
  function carregandoTxt(fonte) { return fonte ? '—' : '…'; }
  // funil em barras. etapas: [{ n, v, fmt?, taxa?: { frase, v, p, base } }]; a taxa liga a etapa à anterior.
  // A que mais caiu (mais de 5%, com pelo menos 10 na base) fica em vermelho. log: barras em escala log (mídia).
  function funil(etapas, opt) {
    opt = opt || {};

      var extra = [a.v3s ? 'prende ' + pctL(a.hook) + ' · segura ' + pctL(a.hold) : '', 'CTR ' + pct2(a.ctr), temSite ? n0(a.mql) + ' MQL no site' : ''].filter(Boolean).join(' · ');
      return '<div class="gx-lr' + (a === ruim ? ' ruim' : '') + '">' + img(a, 'im') + '<div class="t"><b title="' + esc(a.nome) + '">' + esc(a.nome) + '</b><small>' + extra + '</small><div class="bar"><i style="width:' + a.leads / maxL * 100 + '%"></i></div></div>' +
        '<div class="m"><b>' + n0(a.leads) + ' leads</b>' + (a.cpl != null ? money(a.cpl) + ' cada' : m0(a.gasto) + ' sem lead') + '</div></div>';
    }).join('') + '</div>';
    var O = A.organicos || { ok: false, error: 'sem resposta' }, posts = O.ok ? O.itens.slice() : [];
    var nota = function (m) { return m.alcance != null ? m.alcance : m.curtidas; };
    posts.sort(function (a, b) { return nota(b) - nota(a); });
    var grade = !O.ok ? '<p class="gx-vazio">Não consegui ler os posts do Instagram (' + esc(O.error) + ').</p>' : !posts.length ? '<p class="gx-vazio">Nenhum post no Instagram ' + P().nas + '.</p>' :
      '<div class="gx-posts">' + posts.map(function (m, k) {
        return '<a class="gx-post' + (k === 0 ? ' dest' : '') + '"' + (m.link ? ' href="' + esc(m.link) + '" target="_blank" rel="noopener"' : '') + '><span class="tag">' + (k === 0 ? 'Mais ' + (O.semMetricas ? 'curtido' : 'alcance') : m.tipo) + '</span>' +
          '<div class="img"' + (m.img ? ' style="background-image:url(\'' + esc(m.img).replace(/'/g, '%27') + '\')"' : '') + '></div><div class="c">' +
          '<b>' + (O.semMetricas ? n0(m.curtidas) + '<small>curtidas</small>' : n0(m.alcance) + '<small>alcance</small>') + '</b>' +
          '<p>' + esc(m.legenda || 'Sem legenda') + '</p><small class="d">' + ddmm(m.data) + (O.semMetricas ? ' · ' + n0(m.comentarios) + ' coment.' : ' · ' + n0(m.salvos) + ' salv. · ' + n0(m.compart) + ' compart.') + '</small></div></a>';
      }).join('') + '</div>' + (O.semMetricas ? '<p class="gx-nota">O token do Meta não lê alcance, salvamentos e compartilhamentos dos posts; a grade usa curtidas.</p>' : '');
    return {
      html: T + dest + cartao('ads_click', 'Todos os anúncios', '<span>por leads, ' + P().per + '</span>', lista + (temSite ? '' : '<p class="gx-nota">MQL por anúncio aparece quando a UTM do lead traz o id do anúncio.</p>')) +
        '<h3 class="gx-h">Posts do Instagram</h3>' + cartao('photo_library', 'Publicados no período', '<span>' + (O.semMetricas ? 'por curtidas' : 'por alcance') + '</span>', grade),
      draw: function () {},
    };
  };

  TELAS.marketing = function (o, p, ws) {
    var s = situacao(o.qual, p.qual, false) || 'flat';
    var cQual = hero({ k: '% de qualificação', info: 'MQL ÷ leads. MQL = lead do site com faturamento acima de R$ 50 mil (R$ 100 mil, R$ 200 mil ou mais).',
      pill: [s, { good: 'Leads melhores', bad: 'Leads piores', flat: variacao(o.qual, p.qual) == null ? 'Sem comparação' : 'Qualidade estável' }[s]],
      valor: o.qual != null ? pctL(o.qual) : carregandoTxt(S.leads), de: o.mql != null ? n0(o.mql) + ' MQL de ' + n0(o.leads) + ' leads' : '',
      fatos: [['Custo por MQL', money(o.cmql) + ' ' + cmp(o.cmql, p.cmql, true), 'investimento ÷ MQL'],
        ['Passagem para o comercial', pctL(o.pass) + ' ' + cmp(o.pass, p.pass, false), 'reuniões marcadas ÷ MQL'],
        ['Antes', pctL(p.qual), P().antCurto]] });
    var F = funil([
      { n: 'Leads', v: o.leads, vazio: carregandoTxt(S.leads) },
      { n: 'MQL', v: o.mql, taxa: { frase: 'viraram MQL', v: o.qual, p: p.qual, base: o.leads } },
      { n: 'Reuniões marcadas', v: o.reun, vazio: carregandoTxt(S.ac), taxa: { frase: 'marcaram reunião', v: o.pass, p: p.pass, base: o.mql } },
    ]);
    var cF = '<section class="card gx-side"><div class="sz-row"><span class="sz-k">Do lead à reunião</span>' + (F.pior ? pill('bad', 'Atenção') : '') + '</div>' + F.html +
      '<p class="gx-nota">No-show: ' + n0(o.noshow) + ' ' + cmp(o.noshow, p.noshow, true, true) + ' · tempo até o 1º contato e nutrição ainda não são medidos.</p></section>';
    var faixas = ordena(o.faixa || {}).sort(function (a, b) { var i = FAIXAS.indexOf(a.nome), j = FAIXAS.indexOf(b.nome); return (i < 0 ? 99 : i) - (j < 0 ? 99 : j); });
    var etapas = S.ac && S.ac.ok ? S.ac.etapas.filter(function (e) { return e.abertos > 0 && !e.fech; }).map(function (e) { return { nome: e.title, v: e.abertos }; }) : [];
    return {
      html: titulo('Marketing', 'Os leads que chegam são bons e estão avançando para o comercial?') + '<div class="sz-grid">' + cQual + cF + '</div>' +
        '<div class="gx-grid2">' + cartao('percent', '% de qualificação por ' + P().serie, '<span>MQL ÷ leads</span>', plot('g-qual')) +
        cartao('alt_route', 'MQL por origem', '<span>' + P().per + '</span>', o.temLeads ? barrasH(ordena(o.origMql, ORIGEM), n0) : '<p class="gx-vazio">Carregando…</p>') + '</div>' +
        '<div class="gx-grid2">' + cartao('storefront', 'Leads por faixa de faturamento', '<span><i class="org"></i>MQL: acima de R$ 50 mil</span>', o.temLeads ? barrasH(faixas, n0, function (it) { return ehMql(it.nome); }) : '<p class="gx-vazio">Carregando…</p>') +
        cartao('view_kanban', 'Negócios abertos por etapa', '<span>agora, no ActiveCampaign</span>', S.ac ? barrasH(etapas, n0) : '<p class="gx-vazio">Carregando…</p>') + '</div>',
      draw: function () { linha('g-qual', ws, 'qual', pctL, pctEixo); },
    };
  };

  TELAS.comercial = function (o, p, ws) {
    var J = janelas(), MJ = metaJanela(J.c0, J.c1), alvo = (metaDoMes(HOJE.slice(0, 7)) || {}).ticket;
    var parcial = !!(MJ && MJ.desde > J.c0), metaP = MJ ? MJ.meta : null;
    var recMeta = MJ ? (parcial ? agrega(MJ.desde, J.c1).receita : o.receita) : null;
    var s, t;
    if (metaP && recMeta != null) { s = recMeta >= metaP ? 'good' : 'bad'; t = s === 'good' ? 'No ritmo da meta' : 'Abaixo da meta'; }
    else { s = situacao(o.receita, p.receita, false) || 'flat'; t = { good: 'Receita subiu', bad: 'Receita caiu', flat: variacao(o.receita, p.receita) == null ? 'Sem comparação' : 'Receita estável' }[s]; }
    var cRec = hero({ k: parcial ? 'Receita desde ' + ddmm(MJ.desde) + ', quando a meta começa' : 'Receita do período',
      info: 'Valor dos negócios que chegaram a Boas-vindas no ActiveCampaign. A meta é a de cada mês dividida pelos dias dele, somada nos dias com meta.',
      pill: [s, t], valor: (parcial ? recMeta : o.receita) != null ? m0(parcial ? recMeta : o.receita) : carregandoTxt(S.ac),
      de: metaP ? 'de ' + m0(metaP) + ' · meta ' + (parcial ? 'desses dias' : 'do período') : (p.receita != null ? 'antes ' + m0(p.receita) : ''),
      meter: metaP && recMeta != null ? [s, recMeta, metaP, null, ''] : null,
      fatos: [parcial ? ['Receita ' + P().nas, m0(o.receita) + ' ' + cmp(o.receita, p.receita, false), 'antes ' + m0(p.receita)] : ['Vendas', n0(o.vendas) + ' ' + cmp(o.vendas, p.vendas, false, true), 'negócios fechados'],
        ['Ticket médio', m0(o.ticket), alvo ? 'alvo ' + m0(alvo) : ''],
        ['CAC', m0(o.cac), o.cac != null && o.ticket != null ? (o.cac < o.ticket ? 'abaixo do ticket' : 'acima do ticket') : 'investimento ÷ vendas']] });
    var F = funil([
      { n: 'Reuniões marcadas', v: o.reun, vazio: carregandoTxt(S.ac) },
      { n: 'Realizadas', v: o.realiz, taxa: { frase: 'compareceram', v: o.comp, p: p.comp, base: o.reun } },
      { n: 'Vendas', v: o.vendas, taxa: { frase: 'fecharam', v: o.conv, p: p.conv, base: o.realiz } },
    ]);
    // as vendas do período, da mais recente: cliente, data, origem e valor
    function vendasLista() {
      if (!S.ac) return '<p class="gx-vazio">Carregando…</p>';
      if (!S.ac.ok) return '<p class="gx-vazio">Não consegui ler as vendas no ActiveCampaign.</p>';
      var vs = S.ac.fechamentos.filter(function (f) { return f.data >= J.c0 && f.data <= J.c1; }).sort(function (a, b) { return b.data.localeCompare(a.data); });
      if (!vs.length) return '<p class="gx-vazio">Nenhuma venda ' + P().nas + '.</p>';
      var max = Math.max.apply(null, vs.map(function (f) { return f.valor || 0; }).concat([1]));
      return '<div class="gx-li">' + vs.slice(0, 6).map(function (f) {
        return '<div class="gx-lr"><span class="k">' + f.data.slice(8, 10) + '</span><div class="t"><b>' + esc(f.cliente || 'Negócio ' + f.deal) + '</b><small>' + ddmm(f.data) + ' · ' +
          (f.site ? 'lead do site' + (f.fat ? ', fatura ' + esc(f.fat) : '') : 'fora do site') + (f.aprox ? ' · data aproximada' : '') + '</small>' +
          '<div class="bar"><i style="width:' + (f.valor || 0) / max * 100 + '%"></i></div></div><div class="m"><b>' + m0(f.valor) + '</b></div></div>';
      }).join('') + '</div>' + (vs.length > 6 ? '<p class="gx-nota">E mais ' + n0(vs.length - 6) + (vs.length - 6 === 1 ? ' venda.' : ' vendas.') + '</p>' : '');
    }
    var abertos = S.ac && S.ac.ok ? S.ac.etapas.reduce(function (sm, e) { return sm + (e.fech ? 0 : e.abertos || 0); }, 0) : null;
    var cF = '<section class="card gx-side"><div class="sz-row"><span class="sz-k">Da reunião à venda</span>' + (F.pior ? pill('bad', 'Atenção') : '') + '</div>' + F.html +
      '<div class="gx-fpe"><span>No-show <b>' + n0(o.noshow) + '</b></span><span>Ciclo de venda <b>' + (o.ciclo != null ? n0(Math.round(o.ciclo)) + ' dias' : '—') + '</b></span><span>Em aberto <b>' + (abertos == null ? carregandoTxt(S.ac) : n0(abertos)) + '</b></span></div></section>';
    return {
      html: titulo('Comercial', 'Estamos transformando reuniões em receita, no ritmo da meta?') + '<div class="sz-grid">' + cRec + cF + '</div>' +
        '<div class="gx-grid2">' + cartao('payments', 'Receita por ' + P().serie, legSemanas(), plot('g-rec')) +
        cartao('receipt_long', 'Vendas do período', '<span>' + (o.temAc ? n0(o.vendasSite) + ' do site · ' + n0(o.vendas - o.vendasSite) + ' fora do site' : '') + '</span>', vendasLista()) + '</div>' +
        '<p class="gx-nota">Ciclo de venda = mediana de dias entre o negócio criado e a venda. Vendedor de cada venda e motivos de perda ainda não são lidos do ActiveCampaign.</p>',
      draw: function () { barras('g-rec', ws, 'receita', m0, kfmt); },
    };
  };

  /* ── desenho ──────────────────────────────────────── */
  function render() {
    charts.forEach(function (c) { c.destroy(); }); charts = [];
    var J = janelas(), o = agrega(J.c0, J.c1), p = agrega(J.p0, J.p1), ws = semanas();
    var v = TELAS[S.tela](o, p, ws);
    $('content').innerHTML = v.html;
    v.draw();
    // avisos de fonte
    var notas = [];
    [[S.meta, 'Meta Ads'], [S.leads, 'leads do site'], [S.ac, 'ActiveCampaign'], [S.metas, 'metas']].forEach(function (x) { if (x[0] && !x[0].ok) notas.push(['error', 'Não consegui ler ' + x[1] + ': ' + x[0].error]); });
    if (S.ac && S.ac.ok && J.p0 < S.ac.desde) notas.push(['info', 'O ActiveCampaign começa em ' + ddmm(S.ac.desde) + '/' + S.ac.desde.slice(0, 4) + ': as comparações de reuniões e vendas com o período anterior ficam de fora.']);
    $('notice').innerHTML = notas.map(function (n) { return '<div class="notice ' + (n[0] === 'info' ? 'info' : '') + '"><span class="ms" aria-hidden="true">' + (n[0] === 'info' ? 'info' : 'error') + '</span><span>' + esc(n[1]) + '</span></div>'; }).join('');
    $('foot').textContent = 'Fontes: Meta Ads, site (leads) e ActiveCampaign · ' + P().per + ' (' + ddmm(J.c0) + ' a ' + ddmm(J.c1) + ') contra ' + P().ant + ' (' + ddmm(J.p0) + ' a ' + ddmm(J.p1) + ')' +
      (S.ac && S.ac.geradoEm ? ' · ActiveCampaign lido às ' + new Date(S.ac.geradoEm).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '');
  }

  function irPara(t) {
    S.tela = TELAS[t] ? t : 'resumo';
    document.querySelectorAll('#telas .view').forEach(function (b) { var on = b.dataset.t === S.tela; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    if (location.hash.slice(1) !== S.tela) history.replaceState(null, '', '#' + S.tela);
    render();
    window.scrollTo(0, 0);
  }
  function marcaPeriodo() {
    document.querySelectorAll('#periodo .tab').forEach(function (b) { var on = !S.mes && +b.dataset.s === S.sem; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    $('mbox').classList.toggle('on', !!S.mes);
    $('mesSel').value = S.mes || '';
  }
  // meses desde o começo dos dados, do mais recente ao mais antigo
  function preencheMeses() {
    var html = '<option value="">Escolher mês</option>', ym = HOJE.slice(0, 7);
    for (var m = ym; m >= PRIMEIRO_MES; m = ymAdd(m, -1)) html += '<option value="' + m + '">' + nomeMes(m).charAt(0).toUpperCase() + nomeMes(m).slice(1) + ' de ' + m.slice(0, 4) + (m === ym ? ' (este mês)' : '') + '</option>';
    $('mesSel').innerHTML = html;
  }
  function guardaPeriodo() { try { localStorage.setItem('gestao_prefs', JSON.stringify({ sem: S.sem, mes: S.mes })); } catch (x) {} }

  /* ── eventos ──────────────────────────────────────── */
  $('telas').addEventListener('click', function (e) { var b = e.target.closest('.view'); if (b) irPara(b.dataset.t); });
  $('content').addEventListener('click', function (e) { var b = e.target.closest('[data-ir]'); if (b) irPara(b.dataset.ir); });
  $('periodo').addEventListener('click', function (e) {
    var b = e.target.closest('.tab'); if (!b) return;
    S.sem = +b.dataset.s; S.mes = null; marcaPeriodo(); guardaPeriodo();
    carregarCamp(); render();
  });
  $('mesSel').addEventListener('change', function () {
    S.mes = this.value || null; marcaPeriodo(); guardaPeriodo();
    carregarCamp(); render();
  });
  $('refresh').addEventListener('click', function () { carregar(true); });
  window.addEventListener('hashchange', function () { irPara(location.hash.slice(1)); });
  // toque/clique no "i" mostra a explicação (no celular não existe "passar o mouse")
  var pop = null;
  function fechaPop() { if (pop) { pop.remove(); pop = null; } }
  document.addEventListener('click', function (e) {
    var h = e.target.closest('.hint'); fechaPop(); if (!h) return;
    pop = document.createElement('div'); pop.className = 'hint-pop'; pop.setAttribute('role', 'tooltip'); pop.textContent = h.getAttribute('title');
    document.body.appendChild(pop);
    var rc = h.getBoundingClientRect(), w = pop.offsetWidth;
    pop.style.left = Math.max(12, Math.min(window.innerWidth - w - 12, rc.left - w / 2 + rc.width / 2)) + 'px';
    pop.style.top = (rc.bottom + 8) + 'px';
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') fechaPop(); });
  window.addEventListener('scroll', fechaPop, { passive: true });

  if (!getToken()) location.href = '/login';
  else { preencheMeses(); marcaPeriodo(); irPara(location.hash.slice(1)); carregar(false); }
})();
</script>
</body>
</html>
